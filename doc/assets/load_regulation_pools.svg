<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="721.0" viewBox="0 0 1900 721.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8b9a"/></marker></defs><rect width="1900" height="721.0" fill="#ffffff"/><text x="44" y="44" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#132030" text-anchor="start">Bondy — pools, worker queues and what happens when they fill</text><text x="44" y="69" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6d80" text-anchor="start">Every bounded pool and queue on the request path: what feeds it, what bounds it, and whether overflow blocks, evicts or drops.</text><rect x="44" y="87" width="16" height="14" rx="3.5" fill="#efeafa" stroke="#6b4fbb" stroke-width="1.6"/><text x="67" y="99" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6d80" text-anchor="start">Pool / worker queue</text><rect x="223.3" y="87" width="16" height="14" rx="3.5" fill="#e9f5ed" stroke="#2e7d4f" stroke-width="1.6"/><text x="246.3" y="99" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6d80" text-anchor="start">Summary</text><rect x="36" y="146" width="1828" height="519.0" rx="11" fill="#fbfcfd" stroke="#dfe5ec" stroke-width="1.5"/><text x="54" y="135" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5d6d80" text-anchor="start">POOLS &amp; WORKER QUEUES</text><rect x="42" y="168" width="436" height="222.5" rx="8" fill="#efeafa" stroke="#6b4fbb" stroke-width="1.7"/><rect x="42" y="168" width="5" height="222.5" rx="2.5" fill="#6b4fbb"/><text x="59" y="193" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4a3487">Router pool  (sidejob)</text><text x="59" y="215" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Fed by: locally-originated WAMP routing.</text><text x="59" y="232.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Unordered — any worker may take any job.</text><text x="59" y="250.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030"></text><text x="59" y="267.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">On overload the publish path logs and routes</text><text x="59" y="285.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">SYNCHRONOUSLY, blocking the caller. It does</text><text x="59" y="302.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">not drop the message.</text><text x="59" y="326.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">router.pool.size      16</text><text x="59" y="341.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">router.pool.capacity  2,000,000</text><text x="59" y="357.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">router.pool.type      transient</text><rect x="502" y="168" width="436" height="222.5" rx="8" fill="#efeafa" stroke="#6b4fbb" stroke-width="1.7"/><rect x="502" y="168" width="5" height="222.5" rx="2.5" fill="#6b4fbb"/><text x="519" y="193" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4a3487">Flow pool  (bondy_router_worker)</text><text x="519" y="215" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Fed by: Partisan relay and bridge-relay</text><text x="519" y="232.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">INGRESS ONLY — never local routing.</text><text x="519" y="250.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030"></text><text x="519" y="267.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Per-flow FIFO: one worker per flow key. Over</text><text x="519" y="285.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">its share the message is SHED. It cannot spill</text><text x="519" y="302.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">to another worker or run inline — either would</text><text x="519" y="320.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">overtake the flow&#x27;s queued messages.</text><text x="519" y="343.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">flow_pool.capacity 100,000 / router.pool.size</text><text x="519" y="359.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">-&gt; bondy_wamp_dropped_total{shed, family}</text><rect x="962" y="168" width="436" height="222.5" rx="8" fill="#efeafa" stroke="#6b4fbb" stroke-width="1.7"/><rect x="962" y="168" width="5" height="222.5" rx="2.5" fill="#6b4fbb"/><text x="979" y="193" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4a3487">Session manager pool</text><text x="979" y="215" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Fed by: session open and close.</text><text x="979" y="232.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030"></text><text x="979" y="250.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Hashed gen_server pool owning session</text><text x="979" y="267.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">lifecycle: store the session, monitor its</text><text x="979" y="285.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">connection process, register per-session</text><text x="979" y="302.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">procedures, close individually or in bulk.</text><text x="979" y="326.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">session_manager.pool.size  32</text><rect x="1422" y="168" width="436" height="222.5" rx="8" fill="#efeafa" stroke="#6b4fbb" stroke-width="1.7"/><rect x="1422" y="168" width="5" height="222.5" rx="2.5" fill="#6b4fbb"/><text x="1439" y="193" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4a3487">Job manager pool + FIFO queues</text><text x="1439" y="215" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Fed by: meta events and WAMP event</text><text x="1439" y="232.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">publication.</text><text x="1439" y="250.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030"></text><text x="1439" y="267.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">One bounded passive FIFO per worker. Past</text><text x="1439" y="285.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">the size bound the OLDEST entry is evicted;</text><text x="1439" y="302.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">entries also expire on TTL.</text><text x="1439" y="326.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">job_manager.pool.size   16</text><text x="1439" y="341.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">job_manager.queue.size  160,000 (all queues)</text><text x="1439" y="357.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">job_manager.queue.ttl   1m</text><rect x="42" y="424.5" width="436" height="220.5" rx="8" fill="#efeafa" stroke="#6b4fbb" stroke-width="1.7"/><rect x="42" y="424.5" width="5" height="220.5" rx="2.5" fill="#6b4fbb"/><text x="59" y="449.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4a3487">Registry partitions</text><text x="59" y="471.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Fed by: SUBSCRIBE / REGISTER and removals.</text><text x="59" y="489.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030"></text><text x="59" y="506.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Serialises registry writes. The partition is</text><text x="59" y="524.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">hashed from the realm URI, so ONE busy realm</text><text x="59" y="541.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">always lands on ONE partition — raising this</text><text x="59" y="559.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">only helps when many realms are in use.</text><text x="59" y="582.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">registry.partitions       32</text><text x="59" y="598.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">db.registry.shard_count   (storage, separate)</text><rect x="502" y="424.5" width="436" height="220.5" rx="8" fill="#efeafa" stroke="#6b4fbb" stroke-width="1.7"/><rect x="502" y="424.5" width="5" height="220.5" rx="2.5" fill="#6b4fbb"/><text x="519" y="449.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4a3487">Transport queue</text><text x="519" y="471.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Fed by: HTTP long-poll and SSE transports,</text><text x="519" y="489.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">which are not continuously connected.</text><text x="519" y="506.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030"></text><text x="519" y="524.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Bounded sharded ETS queue with three</text><text x="519" y="541.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">independent bounds: message count, total</text><text x="519" y="559.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">byte size, and a background TTL sweep.</text><text x="519" y="582.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">http_transport.queue.max_messages / .max_bytes</text><text x="519" y="598.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">  .message_ttl · .partitions · .eviction_interval</text><text x="519" y="613.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">http_transport.idle_timeout (the session&#x27;s)</text><rect x="962" y="424.5" width="436" height="220.5" rx="8" fill="#efeafa" stroke="#6b4fbb" stroke-width="1.7"/><rect x="962" y="424.5" width="5" height="220.5" rx="2.5" fill="#6b4fbb"/><text x="979" y="449.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4a3487">Anti-entropy reactor pool</text><text x="979" y="471.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Fed by: anti-entropy syncs landing.</text><text x="979" y="489.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030"></text><text x="979" y="506.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Applies remote-merge reactions — session</text><text x="979" y="524.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">close, RBAC cache invalidation, routing</text><text x="979" y="541.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">summary updates. Sharded by cell key, so one</text><text x="979" y="559.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">cell&#x27;s changes stay ordered on one worker.</text><text x="979" y="582.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">aae_reactor.pool.size  16</text><rect x="1422" y="424.5" width="436" height="220.5" rx="8" fill="#e9f5ed" stroke="#2e7d4f" stroke-width="1.7"/><rect x="1422" y="424.5" width="5" height="220.5" rx="2.5" fill="#2e7d4f"/><text x="1439" y="449.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1d5334">What happens when each one fills</text><text x="1439" y="471.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#132030">Only the flow pool loses messages outright:</text><text x="1439" y="495.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">router pool      routes synchronously</text><text x="1439" y="510.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">flow pool        drops (shed), counted</text><text x="1439" y="526.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">job queue        evicts oldest, then TTL</text><text x="1439" y="541.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">transport queue  per overflow_strategy</text><text x="1439" y="557.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">registry parts   no bound; writes serialise</text><text x="1439" y="572.5" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">session manager  no bound; work queues</text><text x="1439" y="588.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5d6d80">aae reactor      no bound; work queues</text><text x="44" y="697.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">Verified against schema/bondy.schema and the modules named above.   Continues in: Ingress and admission · Regulators and signals.</text></svg>