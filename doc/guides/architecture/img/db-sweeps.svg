<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="s-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--mu,#6b6862)"/>
    </marker>
  </defs>
  <style>
    /* Self-sufficient palette. A plate embedded as an image renders in its own
       document, so the host page's custom properties cannot reach it — these
       are the values that apply standalone, in either theme. When the plate is
       inlined into a page instead, this block is dropped and the page's own
       tokens drive the same var() references. */
    :root{--ik:#0b0b0c;--pa:#f1efec;--mu:#6b6862;--sp:#14705f;--ru:#d9d5cf}
    @media (prefers-color-scheme:dark){
      :root{--ik:#eeece8;--pa:#121415;--mu:#9a968f;--sp:#5fd6b4;--ru:#2c3032}
    }

    .ink{fill:var(--ik,#0b0b0c)} .mu{fill:var(--mu,#6b6862)} .sp{fill:var(--sp,#14705f)}
    .fill{fill:var(--pa,#f1efec); stroke:var(--ik,#0b0b0c); stroke-width:1.3}
    .axis{stroke:var(--mu,#6b6862); stroke-width:1}
    .cfg{stroke:var(--sp,#14705f); stroke-width:1.6; stroke-dasharray:5 4; fill:none}
    .cfgbx{fill:var(--sp,#14705f); fill-opacity:.10; stroke:var(--sp,#14705f); stroke-width:1}
    .tick{stroke:var(--sp,#14705f); stroke-width:2.2}
    .ts{font-size:10.5px} .t{font-size:12px} .tb{font-size:13.5px; font-weight:600}
    .tk{font-size:10.5px; font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:600}
  </style>

  <rect width="100%" height="100%" fill="var(--pa,#f1efec)"/>


  <text class="tb ink" x="40" y="34">Background sweeps — period and per-tick budget</text>
  <text class="ts mu"  x="40" y="52">Three independent timers. Each option sets either how often a pass runs, or how much one pass is allowed to do.</text>

  <!-- ============ reclamation ============ -->
  <text class="t ink" x="40" y="106">Reclamation</text>
  <text class="ts mu" x="40" y="121">cell space</text>
  <line class="axis" x1="200" y1="112" x2="880" y2="112"/>
  <g class="tick">
    <line x1="240" y1="98" x2="240" y2="126"/><line x1="400" y1="98" x2="400" y2="126"/>
    <line x1="560" y1="98" x2="560" y2="126"/><line x1="720" y1="98" x2="720" y2="126"/>
  </g>
  <line class="axis" x1="240" y1="84" x2="400" y2="84" marker-start="url(#s-arm)" marker-end="url(#s-arm)"/>
  <text class="ts mu" x="320" y="78" text-anchor="middle">db.reclaim.interval = 1m</text>
  <rect class="fill" x="240" y="132" width="46" height="18"/>
  <rect class="fill" x="400" y="132" width="46" height="18"/>
  <rect class="fill" x="560" y="132" width="46" height="18"/>
  <rect class="fill" x="720" y="132" width="46" height="18"/>
  <text class="ts mu" x="790" y="145">at most 500 cells scanned per pass</text>
  <rect class="cfgbx" x="240" y="158" width="232" height="20" rx="4"/>
  <text class="tk sp" x="248" y="172">db.reclaim.batch_cells = 500</text>
  <rect class="cfgbx" x="484" y="158" width="140" height="20" rx="4"/>
  <text class="tk sp" x="492" y="172">db.reclaim = on</text>

  <!-- ============ origin retirement ============ -->
  <line x1="40" y1="204" x2="920" y2="204" stroke="var(--ru,#d9d5cf)" stroke-width="1"/>
  <text class="t ink" x="40" y="256">Origin retirement</text>
  <text class="ts mu" x="40" y="271">departed peers</text>
  <line class="axis" x1="200" y1="262" x2="880" y2="262"/>
  <g class="tick">
    <line x1="280" y1="248" x2="280" y2="276"/><line x1="600" y1="248" x2="600" y2="276"/>
  </g>
  <line class="axis" x1="280" y1="234" x2="600" y2="234" marker-start="url(#s-arm)" marker-end="url(#s-arm)"/>
  <text class="ts mu" x="440" y="228" text-anchor="middle">db.origin_retirement.interval = 10m</text>
  <rect class="fill" x="280" y="282" width="60" height="18"/>
  <rect class="fill" x="600" y="282" width="60" height="18"/>
  <rect class="cfgbx" x="280" y="310" width="304" height="20" rx="4"/>
  <text class="tk sp" x="288" y="324">db.origin_retirement.path = origin_retirement</text>
  <rect class="cfgbx" x="596" y="310" width="188" height="20" rx="4"/>
  <text class="tk sp" x="604" y="324">db.origin_retirement = on</text>

  <!-- ============ instance heap monitor ============ -->
  <line x1="40" y1="356" x2="920" y2="356" stroke="var(--ru,#d9d5cf)" stroke-width="1"/>
  <text class="t ink" x="40" y="404">Instance heap monitor</text>
  <text class="ts mu" x="40" y="419">per instance</text>
  <line class="axis" x1="200" y1="470" x2="880" y2="470"/>
  <line class="axis" x1="200" y1="384" x2="200" y2="470"/>
  <text class="ts mu" x="150" y="392">heap</text>

  <!-- heap grows past the delta, hibernate, repeat -->
  <path d="M200 462 L280 430 L360 402 L361 462 L440 434 L520 402 L521 462 L600 438 L680 402 L681 462 L760 440 L840 414"
        fill="none" stroke="var(--sp,#14705f)" stroke-width="2"/>
  <line class="cfg" x1="200" y1="402" x2="880" y2="402"/>
  <rect class="cfgbx" x="640" y="378" width="248" height="20" rx="4"/>
  <text class="tk sp" x="648" y="392">db.gc_heap_delta = 16MB</text>
  <g class="tick" stroke-width="1.2" opacity=".55">
    <line x1="240" y1="466" x2="240" y2="474"/><line x1="280" y1="466" x2="280" y2="474"/>
    <line x1="320" y1="466" x2="320" y2="474"/><line x1="360" y1="466" x2="360" y2="474"/>
    <line x1="400" y1="466" x2="400" y2="474"/><line x1="440" y1="466" x2="440" y2="474"/>
    <line x1="480" y1="466" x2="480" y2="474"/><line x1="520" y1="466" x2="520" y2="474"/>
  </g>
  <text class="ts sp" x="366" y="484">every tick: check own heap · fullsweep-hibernate when it has grown past the delta</text>
  <rect class="cfgbx" x="200" y="492" width="196" height="20" rx="4"/>
  <text class="tk sp" x="208" y="506">db.gc_interval = 2s</text>
  <text class="ts mu" x="408" y="506">Reclaims transient apply/AAE garbage a long-lived instance would otherwise hold until the next major GC.</text>
  <text class="ts mu" x="40" y="530">Every option above is a bondy.conf key; values shown are the defaults.</text>
</svg>
