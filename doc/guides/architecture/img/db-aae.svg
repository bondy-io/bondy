<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="a-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--mu,#6b6862)"/>
    </marker>
    <marker id="a-ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sp,#14705f)"/>
    </marker>
  </defs>
  <style>
    /* Self-sufficient palette. A plate embedded as an image renders in its own
       document, so the host page's custom properties cannot reach it — these
       are the values that apply standalone, in either theme. When the plate is
       inlined into a page instead, this block is dropped and the page's own
       tokens drive the same var() references. */
    :root{--ik:#0b0b0c;--pa:#f1efec;--mu:#6b6862;--sp:#14705f;--ru:#d9d5cf}
    @media (prefers-color-scheme:dark){
      :root{--ik:#eeece8;--pa:#121415;--mu:#9a968f;--sp:#5fd6b4;--ru:#2c3032}
    }

    .ink{fill:var(--ik,#0b0b0c)} .mu{fill:var(--mu,#6b6862)} .sp{fill:var(--sp,#14705f)}
    .fill{fill:var(--pa,#f1efec); stroke:var(--ik,#0b0b0c); stroke-width:1.3}
    .axis{stroke:var(--mu,#6b6862); stroke-width:1}
    .cfg{stroke:var(--sp,#14705f); stroke-width:1.6; stroke-dasharray:5 4; fill:none}
    .cfgbx{fill:var(--sp,#14705f); fill-opacity:.10; stroke:var(--sp,#14705f); stroke-width:1}
    .ts{font-size:10.5px} .t{font-size:12px} .tb{font-size:13.5px; font-weight:600}
    .tt{font-size:11.5px; font-family:'JetBrains Mono',ui-monospace,monospace}
    .tk{font-size:10.5px; font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:600}
  </style>

  <rect width="100%" height="100%" fill="var(--pa,#f1efec)"/>


  <text class="tb ink" x="40" y="34">Anti-entropy — the page budget is node-wide</text>
  <text class="ts mu"  x="40" y="52">Concurrency divides a fixed budget. It buys fairness across shards, never more memory.</text>

  <!-- ===== Panel A: the budget bar ===== -->
  <rect class="fill" x="200" y="82" width="660" height="52"/>
  <line x1="420" y1="82" x2="420" y2="134" stroke="var(--ik,#0b0b0c)" stroke-width="1.3"/>
  <line x1="640" y1="82" x2="640" y2="134" stroke="var(--ik,#0b0b0c)" stroke-width="1.3"/>
  <rect x="200" y="82" width="660" height="52" fill="var(--sp,#14705f)" fill-opacity=".12" stroke="none"/>
  <text class="tt ink" x="310" y="105" text-anchor="middle">session 1</text>
  <text class="tt ink" x="530" y="105" text-anchor="middle">session 2</text>
  <text class="tt ink" x="750" y="105" text-anchor="middle">session 3</text>
  <text class="ts mu"  x="310" y="122" text-anchor="middle">≈682 pages/round</text>
  <text class="ts mu"  x="530" y="122" text-anchor="middle">≈682 pages/round</text>
  <text class="ts mu"  x="750" y="122" text-anchor="middle">≈682 pages/round</text>
  <text class="t ink"  x="40" y="105">in-flight</text>
  <text class="t ink"  x="40" y="121">MST pages</text>

  <line class="axis" x1="200" y1="152" x2="860" y2="152" marker-start="url(#a-arm)" marker-end="url(#a-arm)"/>
  <rect class="cfgbx" x="380" y="158" width="300" height="20" rx="4"/>
  <text class="tk sp" x="388" y="172">db.aae.max_pages_in_flight = 2048</text>
  <rect class="cfgbx" x="380" y="184" width="300" height="20" rx="4"/>
  <text class="tk sp" x="388" y="198">db.aae.max_concurrency = 3</text>
  <text class="ts mu" x="200" y="216">pages per round  =  budget ÷ concurrency</text>
  <text class="ts mu" x="200" y="232">Raising concurrency narrows every lane; the bar's width never moves. This is the lever that bounds peak RAM.</text>

  <!-- ===== Panel B: tick and fanout ===== -->
  <line x1="40" y1="256" x2="920" y2="256" stroke="var(--ru,#d9d5cf)" stroke-width="1"/>
  <text class="tb ink" x="40" y="286">Scheduling — how often, and to how many peers</text>

  <line class="axis" x1="200" y1="330" x2="620" y2="330"/>
  <g stroke="var(--sp,#14705f)" stroke-width="2.2">
    <line x1="240" y1="318" x2="240" y2="342"/><line x1="340" y1="318" x2="340" y2="342"/>
    <line x1="440" y1="318" x2="440" y2="342"/><line x1="540" y1="318" x2="540" y2="342"/>
  </g>
  <line class="axis" x1="240" y1="306" x2="340" y2="306" marker-start="url(#a-arm)" marker-end="url(#a-arm)"/>
  <text class="ts mu" x="290" y="300" text-anchor="middle">db.aae.interval = 500ms</text>
  <text class="t ink" x="40" y="334">AE tick</text>

  <circle cx="680" cy="330" r="16" class="fill"/>
  <text class="ts ink" x="680" y="334" text-anchor="middle">this</text>
  <g stroke="var(--sp,#14705f)" stroke-width="1.6" fill="none" marker-end="url(#a-ars)">
    <path d="M698 320 L775 296"/><path d="M700 330 L775 330"/><path d="M698 340 L775 364"/>
  </g>
  <circle cx="790" cy="294" r="11" class="fill"/><circle cx="790" cy="330" r="11" class="fill"/><circle cx="790" cy="366" r="11" class="fill"/>
  <rect class="cfgbx" x="620" y="384" width="212" height="20" rx="4"/>
  <text class="tk sp" x="628" y="398">db.aae.fanout = 3</text>
  <rect class="cfgbx" x="200" y="384" width="140" height="20" rx="4"/>
  <text class="tk sp" x="208" y="398">db.aae = on</text>

  <!-- ===== Panel C: the load gate ===== -->
  <line x1="40" y1="428" x2="920" y2="428" stroke="var(--ru,#d9d5cf)" stroke-width="1"/>
  <text class="tb ink" x="40" y="458">Load gate — when AE steps aside</text>

  <line class="axis" x1="200" y1="548" x2="720" y2="548"/>
  <line class="axis" x1="200" y1="472" x2="200" y2="548"/>
  <text class="ts mu" x="40" y="480">run_queue ÷</text>
  <text class="ts mu" x="40" y="494">schedulers_online</text>
  <text class="ts mu" x="186" y="552" text-anchor="end">0</text>
  <text class="ts mu" x="186" y="508" text-anchor="end">2.0</text>

  <line class="cfg" x1="200" y1="504" x2="720" y2="504"/>
  <path d="M200 542 L250 538 L300 528 L350 512 L400 492 L450 486 L500 496 L550 514 L600 532 L650 538 L700 540"
        fill="none" stroke="var(--sp,#14705f)" stroke-width="2"/>
  <rect x="350" y="472" width="180" height="32" fill="var(--ik,#0b0b0c)" fill-opacity=".07" stroke="none"/>
  <text class="ts ink" x="440" y="468" text-anchor="middle">AE yields its throttleable dispatches</text>

  <rect class="cfgbx" x="740" y="486" width="204" height="20" rx="4"/>
  <text class="tk sp" x="748" y="500">db.aae.load_run_queue_threshold = 2.0</text>
  <rect class="cfgbx" x="740" y="512" width="204" height="20" rx="4"/>
  <text class="tk sp" x="748" y="526">db.aae.load_adaptive = off</text>
  <text class="ts mu" x="740" y="548">The threshold is only consulted</text>
  <text class="ts mu" x="740" y="562">when load_adaptive is on.</text>

  <text class="ts mu" x="200" y="572">EWMA-smoothed, so a momentary burst cannot flap the yield. A healthy node hovers near 0–1.</text>
  <text class="ts mu" x="40" y="590">Every option above is a bondy.conf key; values shown are the defaults.</text>
</svg>
