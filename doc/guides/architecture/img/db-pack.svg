<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="p-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--mu,#6b6862)"/>
    </marker>
  </defs>
  <style>
    /* Self-sufficient palette. A plate embedded as an image renders in its own
       document, so the host page's custom properties cannot reach it — these
       are the values that apply standalone, in either theme. When the plate is
       inlined into a page instead, this block is dropped and the page's own
       tokens drive the same var() references. */
    :root{--ik:#0b0b0c;--pa:#f1efec;--mu:#6b6862;--sp:#14705f;--ru:#d9d5cf}
    @media (prefers-color-scheme:dark){
      :root{--ik:#eeece8;--pa:#121415;--mu:#9a968f;--sp:#5fd6b4;--ru:#2c3032}
    }

    .ink{fill:var(--ik,#0b0b0c)} .mu{fill:var(--mu,#6b6862)} .sp{fill:var(--sp,#14705f)}
    .fill{fill:var(--pa,#f1efec); stroke:var(--ik,#0b0b0c); stroke-width:1.4}
    .axis{stroke:var(--mu,#6b6862); stroke-width:1}
    .cfg{stroke:var(--sp,#14705f); stroke-width:1.6; stroke-dasharray:5 4; fill:none}
    .cfgbx{fill:var(--sp,#14705f); fill-opacity:.10; stroke:var(--sp,#14705f); stroke-width:1}
    .ts{font-size:10.5px} .t{font-size:12px} .tb{font-size:13.5px; font-weight:600}
    .tt{font-size:11.5px; font-family:'JetBrains Mono',ui-monospace,monospace}
    .tk{font-size:10.5px; font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:600}
  </style>

  <rect width="100%" height="100%" fill="var(--pa,#f1efec)"/>


  <text class="tb ink" x="40" y="34">MST pack files — sealing</text>
  <text class="ts mu"  x="40" y="52">bondy_oplog_instance · incoming.pack grows until it is sealed and rolled</text>

  <!-- Panel A : incoming.pack fills -->
  <text class="t ink" x="40" y="100">incoming.pack</text>
  <rect class="fill" x="180" y="84" width="470" height="34"/>
  <rect x="180" y="84" width="470" height="34" fill="var(--sp,#14705f)" fill-opacity=".14" stroke="none"/>
  <rect x="650" y="84" width="180" height="34" fill="none" stroke="var(--mu,#6b6862)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="tt ink" x="415" y="106" text-anchor="middle">cell writes accumulate</text>
  <line class="cfg" x1="650" y1="66" x2="650" y2="140"/>
  <rect class="cfgbx" x="530" y="42" width="238" height="22" rx="4"/>
  <text class="tk sp" x="538" y="57">db.pack_auto_seal_bytes = 2MB</text>
  <text class="ts sp" x="660" y="136">seal &amp; roll</text>
  <line class="axis" x1="180" y1="132" x2="650" y2="132" marker-start="url(#p-arm)" marker-end="url(#p-arm)"/>
  <text class="ts mu" x="415" y="150" text-anchor="middle">reads are unaffected either way — they serve from the projection and cache, never the MST</text>

  <!-- Panel B : where the seal runs -->
  <line x1="40" y1="176" x2="920" y2="176" stroke="var(--ru,#d9d5cf)" stroke-width="1"/>
  <text class="tb ink" x="40" y="208">Where the seal runs</text>
  <rect class="cfgbx" x="290" y="192" width="250" height="22" rx="4"/>
  <text class="tk sp" x="298" y="207">db.pack_seal_mode = async | sync</text>

  <!-- async lane -->
  <text class="t ink" x="40" y="258">async</text>
  <text class="ts mu" x="40" y="273">default</text>
  <text class="ts mu" x="40" y="292">apply latency</text>
  <line class="axis" x1="150" y1="292" x2="500" y2="292"/>
  <line class="axis" x1="150" y1="228" x2="150" y2="292"/>
  <path d="M150 284 L200 282 L250 285 L300 281 L350 284 L400 282 L450 285 L500 283"
        fill="none" stroke="var(--sp,#14705f)" stroke-width="2"/>
  <text class="ts sp" x="512" y="288">flat — the seal is driven off the apply path</text>
  <text class="ts mu" x="512" y="304">in short passes of tens of ms</text>

  <!-- sync lane -->
  <text class="t ink" x="40" y="368">sync</text>
  <text class="ts mu" x="40" y="392">apply latency</text>
  <line class="axis" x1="150" y1="392" x2="500" y2="392"/>
  <line class="axis" x1="150" y1="328" x2="150" y2="392"/>
  <path d="M150 384 L210 383 L250 385 L251 336 L262 336 L263 384 L330 383 L370 385 L371 336 L382 336 L383 384 L450 383 L500 385"
        fill="none" stroke="var(--ik,#0b0b0c)" stroke-width="2"/>
  <text class="ts ink" x="512" y="348">one ~600 ms datasync on the critical path</text>
  <text class="ts mu"  x="512" y="364">freezes the apply pipeline and spikes</text>
  <text class="ts mu"  x="512" y="380">read-after-write lag toward db.aae.fence.max_lag</text>

  <text class="ts mu" x="40" y="440">Both the store-open mode and the seal driver resolve the same key — an async store whose put never seals would grow incoming.pack unbounded.</text>
  <text class="ts mu" x="40" y="456">Every option above is a bondy.conf key; values shown are the defaults.</text>
</svg>
