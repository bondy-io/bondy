<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="c-ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sp,#14705f)"/>
    </marker>
    <marker id="c-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--mu,#6b6862)"/>
    </marker>
  </defs>
  <style>
    /* Self-sufficient palette. A plate embedded as an image renders in its own
       document, so the host page's custom properties cannot reach it — these
       are the values that apply standalone, in either theme. When the plate is
       inlined into a page instead, this block is dropped and the page's own
       tokens drive the same var() references. */
    :root{--ik:#0b0b0c;--pa:#f1efec;--mu:#6b6862;--sp:#14705f;--ru:#d9d5cf}
    @media (prefers-color-scheme:dark){
      :root{--ik:#eeece8;--pa:#121415;--mu:#9a968f;--sp:#5fd6b4;--ru:#2c3032}
    }

    .ink{fill:var(--ik,#0b0b0c)} .mu{fill:var(--mu,#6b6862)} .sp{fill:var(--sp,#14705f)}
    .fill{fill:var(--pa,#f1efec); stroke:var(--ik,#0b0b0c); stroke-width:1.3}
    .axis{stroke:var(--mu,#6b6862); stroke-width:1}
    .cfg{stroke:var(--sp,#14705f); stroke-width:1.6; stroke-dasharray:5 4; fill:none}
    .cfgbx{fill:var(--sp,#14705f); fill-opacity:.10; stroke:var(--sp,#14705f); stroke-width:1}
    .ts{font-size:10.5px} .t{font-size:12px} .tb{font-size:13.5px; font-weight:600}
    .tt{font-size:11px; font-family:'JetBrains Mono',ui-monospace,monospace}
    .tk{font-size:10.5px; font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:600}
  </style>

  <rect width="100%" height="100%" fill="var(--pa,#f1efec)"/>


  <text class="tb ink" x="40" y="34">Projection (leveled) — compaction, compression, snapshots</text>
  <text class="ts mu"  x="40" y="52">Journal files are scored, then either compacted alone or swept up in a run.</text>

  <!-- ===== scoring ===== -->
  <text class="t ink" x="40" y="106">journal files</text>
  <text class="ts mu" x="40" y="121">by score</text>
  <line class="axis" x1="180" y1="200" x2="880" y2="200"/>
  <line class="axis" x1="180" y1="86"  x2="180" y2="200"/>
  <text class="ts mu" x="168" y="204" text-anchor="end">0</text>
  <text class="ts mu" x="168" y="166" text-anchor="end">30</text>
  <text class="ts mu" x="168" y="118" text-anchor="end">70</text>
  <text class="ts mu" x="168" y="94"  text-anchor="end">100</text>

  <g>
    <rect class="fill" x="200" y="176" width="34" height="24"/>
    <rect class="fill" x="244" y="182" width="34" height="18"/>
    <rect class="fill" x="288" y="168" width="34" height="32"/>
    <rect class="fill" x="332" y="124" width="34" height="76"/>
    <rect class="fill" x="376" y="112" width="34" height="88"/>
    <rect class="fill" x="420" y="106" width="34" height="94"/>
    <rect class="fill" x="464" y="116" width="34" height="84"/>
    <rect class="fill" x="508" y="110" width="34" height="90"/>
    <rect class="fill" x="552" y="150" width="34" height="50"/>
    <rect class="fill" x="596" y="186" width="34" height="14"/>
  </g>

  <line class="cfg" x1="180" y1="166" x2="880" y2="166"/>
  <line class="cfg" x1="180" y1="118" x2="880" y2="118"/>
  <rect class="cfgbx" x="640" y="156" width="304" height="20" rx="4"/>
  <text class="tk sp" x="648" y="170">db.leveled.singlefile_compaction_percentage = 30.0</text>
  <rect class="cfgbx" x="640" y="108" width="304" height="20" rx="4"/>
  <text class="tk sp" x="648" y="122">db.leveled.maxrunlength_compaction_percentage = 70.0</text>

  <text class="ts sp" x="200" y="220">at or below 30 — eligible alone</text>
  <text class="ts sp" x="340" y="98">a full-length run needs 70+</text>

  <!-- run bracket -->
  <path d="M332 234 L332 226 L542 226 L542 234" fill="none" stroke="var(--sp,#14705f)" stroke-width="1.4"/>
  <text class="ts sp" x="437" y="248" text-anchor="middle">one run — at most 8 files by default</text>
  <rect class="cfgbx" x="180" y="262" width="270" height="20" rx="4"/>
  <text class="tk sp" x="188" y="276">db.leveled.max_run_length = default</text>
  <rect class="cfgbx" x="462" y="262" width="300" height="20" rx="4"/>
  <text class="tk sp" x="470" y="276">db.leveled.journal_compaction_score_one_in = 1</text>
  <text class="ts mu" x="180" y="300">Raising the run length reclaims more per run at the cost of a longer, heavier compaction. Raising the scoring divisor</text>
  <text class="ts mu" x="180" y="314">samples files instead of scoring every one — significant savings on large journals under frequent compaction.</text>

  <!-- after compaction -->
  <rect class="cfgbx" x="180" y="330" width="290" height="20" rx="4"/>
  <text class="tk sp" x="188" y="344">db.leveled.waste_retention_period = off</text>
  <text class="ts mu" x="482" y="344">Compacted files are deleted immediately. A period keeps them,</text>
  <text class="ts mu" x="482" y="358">allowing point-in-time restore at the cost of the disk they hold.</text>
  <rect class="cfgbx" x="180" y="356" width="290" height="20" rx="4"/>
  <text class="tk sp" x="188" y="370">db.leveled.max_merge_below = 24</text>
  <text class="ts mu" x="180" y="392">max_merge_below bounds a ledger merge, not a journal one: below that many overlapping files the merge runs unbounded,</text>
  <text class="ts mu" x="180" y="406">at or above it the merge is partial. Leveled tests at the default.</text>

  <!-- ===== compression ===== -->
  <line x1="40" y1="430" x2="920" y2="430" stroke="var(--ru,#d9d5cf)" stroke-width="1"/>
  <text class="tb ink" x="40" y="462">Compression — where the CPU is spent</text>

  <rect class="fill" x="180" y="480" width="120" height="34"/>
  <text class="tt ink" x="240" y="501" text-anchor="middle">value arrives</text>
  <path d="M304 497 L364 497" stroke="var(--sp,#14705f)" stroke-width="1.6" fill="none" marker-end="url(#c-ars)"/>
  <rect class="fill" x="368" y="480" width="120" height="34"/>
  <text class="tt ink" x="428" y="501" text-anchor="middle">journal</text>
  <path d="M492 497 L552 497" stroke="var(--mu,#6b6862)" stroke-width="1.6" fill="none" marker-end="url(#c-arm)"/>
  <rect class="fill" x="556" y="480" width="120" height="34"/>
  <text class="tt ink" x="616" y="501" text-anchor="middle">compaction</text>
  <line class="cfg" x1="334" y1="466" x2="334" y2="528"/>
  <text class="ts sp" x="334" y="542" text-anchor="middle">on_receipt</text>
  <text class="ts mu" x="334" y="556" text-anchor="middle">default — smaller journal</text>
  <line class="cfg" x1="524" y1="466" x2="524" y2="528"/>
  <text class="ts mu" x="524" y="542" text-anchor="middle">on_compact</text>
  <text class="ts mu" x="524" y="556" text-anchor="middle">faster writes, larger at rest</text>
  <rect class="cfgbx" x="700" y="474" width="244" height="20" rx="4"/>
  <text class="tk sp" x="708" y="488">db.leveled.compression_point = on_receipt</text>
  <rect class="cfgbx" x="700" y="500" width="244" height="20" rx="4"/>
  <text class="tk sp" x="708" y="514">db.leveled.compression_method = lz4</text>
  <rect class="cfgbx" x="700" y="526" width="244" height="20" rx="4"/>
  <text class="tk sp" x="708" y="540">db.leveled.compression_level = 1</text>
  <rect class="cfgbx" x="700" y="552" width="244" height="20" rx="4"/>
  <text class="tk sp" x="708" y="566">db.leveled.ledger_compression = as_store</text>
  <text class="ts mu" x="180" y="580">as_store follows the journal's method; the other values let the ledger take a different trade.</text>

  <!-- ===== snapshots and stats ===== -->
  <line x1="40" y1="602" x2="920" y2="602" stroke="var(--ru,#d9d5cf)" stroke-width="1"/>
  <text class="tb ink" x="40" y="622">Snapshots &amp; statistics</text>
  <rect class="cfgbx" x="180" y="632" width="248" height="20" rx="4"/>
  <text class="tk sp" x="188" y="646">db.leveled.snapshot_timeout_short = 15m</text>
  <rect class="cfgbx" x="180" y="658" width="248" height="20" rx="4"/>
  <text class="tk sp" x="188" y="672">db.leveled.snapshot_timeout_long = 12h</text>
  <text class="ts mu" x="440" y="646">A snapshot pins the files it opened against, so a leaked one holds disk</text>
  <text class="ts mu" x="440" y="660">compaction would otherwise reclaim. The timeouts bound that.</text>
  <rect class="cfgbx" x="180" y="684" width="248" height="20" rx="4"/>
  <text class="tk sp" x="188" y="698">db.leveled.stats_percentage = 10</text>
  <text class="ts mu" x="440" y="686">Sampling keeps statistics off the hot path. Also here:</text>
  <text class="tk mu" x="440" y="700">db.leveled.stats_log_frequency = 30s · db.leveled.log_level = info</text>
</svg>
