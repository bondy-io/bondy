<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="sl-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--mu,#6b6862)"/>
    </marker>
  </defs>
  <style>
    /* Self-sufficient palette. A plate embedded as an image renders in its own
       document, so the host page's custom properties cannot reach it — these
       are the values that apply standalone, in either theme. When the plate is
       inlined into a page instead, this block is dropped and the page's own
       tokens drive the same var() references. */
    :root{--ik:#0b0b0c;--pa:#f1efec;--mu:#6b6862;--sp:#14705f;--ru:#d9d5cf}
    @media (prefers-color-scheme:dark){
      :root{--ik:#eeece8;--pa:#121415;--mu:#9a968f;--sp:#5fd6b4;--ru:#2c3032}
    }

    .ink{fill:var(--ik,#0b0b0c)} .mu{fill:var(--mu,#6b6862)} .sp{fill:var(--sp,#14705f)}
    .fill{fill:var(--pa,#f1efec); stroke:var(--ik,#0b0b0c); stroke-width:1.3}
    .axis{stroke:var(--mu,#6b6862); stroke-width:1}
    .cfg{stroke:var(--sp,#14705f); stroke-width:1.6; stroke-dasharray:5 4; fill:none}
    .cfgbx{fill:var(--sp,#14705f); fill-opacity:.10; stroke:var(--sp,#14705f); stroke-width:1}
    .ts{font-size:10.5px} .t{font-size:12px} .tb{font-size:13.5px; font-weight:600}
    .tk{font-size:10.5px; font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:600}
  </style>

  <rect width="100%" height="100%" fill="var(--pa,#f1efec)"/>


  <text class="tb ink" x="40" y="34">Index rebuild — the bounded primary scan</text>
  <text class="ts mu"  x="40" y="52">The slow-but-correct path rescans every primary cell in the realm and recomputes each value's index terms.</text>

  <!-- realm that fits -->
  <text class="t ink" x="40" y="106">realm A</text>
  <rect class="fill" x="150" y="88" width="360" height="28"/>
  <rect x="150" y="88" width="360" height="28" fill="var(--sp,#14705f)" fill-opacity=".14" stroke="none"/>
  <text class="ts ink" x="330" y="106" text-anchor="middle">every primary cell scanned</text>
  <text class="ts sp" x="700" y="106">complete result</text>

  <!-- realm that overruns -->
  <text class="t ink" x="40" y="176">realm B</text>
  <rect class="fill" x="150" y="158" width="520" height="28"/>
  <rect x="150" y="158" width="520" height="28" fill="var(--sp,#14705f)" fill-opacity=".14" stroke="none"/>
  <rect x="670" y="158" width="200" height="28" fill="none" stroke="var(--mu,#6b6862)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="ts ink" x="410" y="176" text-anchor="middle">scan fills the cap</text>
  <text class="ts mu"  x="770" y="176" text-anchor="middle">never reached</text>

  <line class="cfg" x1="670" y1="74" x2="670" y2="200"/>
  <rect class="cfgbx" x="530" y="212" width="286" height="20" rx="4"/>
  <text class="tk sp" x="538" y="226">db.primary_scan_limit = 1000000</text>

  <text class="ts ink" x="150" y="226">A scan that fills the cap returns a POTENTIALLY INCOMPLETE result</text>
  <text class="ts mu"  x="150" y="242">and logs a warning naming this key — the caller is not told.</text>
  <text class="ts mu"  x="150" y="264">The correct value follows from realm size and nothing else, so raise it for realms holding more cells than the default.</text>
  <text class="ts mu"  x="40"  y="290">Every option above is a bondy.conf key; values shown are the defaults.</text>
</svg>
