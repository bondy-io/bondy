<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="d-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--mu,#6b6862)"/>
    </marker>
  </defs>
  <style>
    /* Self-sufficient palette. A plate embedded as an image renders in its own
       document, so the host page's custom properties cannot reach it — these
       are the values that apply standalone, in either theme. When the plate is
       inlined into a page instead, this block is dropped and the page's own
       tokens drive the same var() references. */
    :root{--ik:#0b0b0c;--pa:#f1efec;--mu:#6b6862;--sp:#14705f;--ru:#d9d5cf}
    @media (prefers-color-scheme:dark){
      :root{--ik:#eeece8;--pa:#121415;--mu:#9a968f;--sp:#5fd6b4;--ru:#2c3032}
    }

    .ink{fill:var(--ik,#0b0b0c)} .mu{fill:var(--mu,#6b6862)} .sp{fill:var(--sp,#14705f)}
    .axis{stroke:var(--mu,#6b6862); stroke-width:1}
    .cfg{stroke:var(--sp,#14705f); stroke-width:1.6; stroke-dasharray:5 4; fill:none}
    .cfgbx{fill:var(--sp,#14705f); fill-opacity:.10; stroke:var(--sp,#14705f); stroke-width:1}
    .ts{font-size:10.5px} .t{font-size:12px} .tb{font-size:13.5px; font-weight:600}
    .tk{font-size:10.5px; font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:600}
  </style>

  <rect width="100%" height="100%" fill="var(--pa,#f1efec)"/>


  <text class="tb ink" x="40" y="34">Applier — drain-stall detection</text>
  <text class="ts mu"  x="40" y="52">bondy_oplog_applier · only a commit beyond the highest position ever committed counts as progress</text>

  <!-- axes -->
  <line class="axis" x1="150" y1="330" x2="880" y2="330"/>
  <line class="axis" x1="150" y1="80"  x2="150" y2="330"/>
  <text class="ts mu" x="60" y="200">drain_max_pos</text>
  <text class="ts mu" x="60" y="215">{Segment, Offset}</text>
  <text class="ts mu" x="880" y="350" text-anchor="end">time</text>

  <!-- progress staircase, then a flat stall, then recovery -->
  <path d="M150 310 H210 V286 H270 V262 H330 V238 H390 V214 H450"
        fill="none" stroke="var(--sp,#14705f)" stroke-width="2.4"/>
  <path d="M450 214 H700" fill="none" stroke="var(--ik,#0b0b0c)" stroke-width="2.4"/>
  <path d="M700 214 V190 H760 V166 H820 V142 H880"
        fill="none" stroke="var(--sp,#14705f)" stroke-width="2.4"/>

  <!-- re-reading old ground, during the stall -->
  <g stroke="var(--mu,#6b6862)" stroke-width="1.2" stroke-dasharray="3 3" fill="none">
    <path d="M480 214 V246"/><path d="M530 214 V246"/><path d="M580 214 V246"/><path d="M630 214 V246"/>
  </g>
  <text class="ts mu" x="555" y="264" text-anchor="middle">frames still being processed —</text>
  <text class="ts mu" x="555" y="278" text-anchor="middle">re-reading ground already committed</text>

  <!-- the alarm window -->
  <line class="cfg" x1="450" y1="96" x2="450" y2="214"/>
  <line class="cfg" x1="700" y1="96" x2="700" y2="214"/>
  <line class="axis" x1="450" y1="110" x2="700" y2="110" marker-start="url(#d-arm)" marker-end="url(#d-arm)"/>
  <text class="ts mu" x="575" y="103" text-anchor="middle">no progress beyond drain_max_pos</text>
  <rect class="cfgbx" x="452" y="120" width="246" height="22" rx="4"/>
  <text class="tk sp" x="460" y="135">db.drain.stall_alarm = 1m</text>

  <circle cx="700" cy="214" r="5" fill="var(--ik,#0b0b0c)"/>
  <text class="t ink" x="712" y="206">alarm raised</text>
  <text class="ts mu" x="712" y="221">{bondy_oplog_drain_stalled, InstanceId}</text>
  <circle cx="760" cy="190" r="5" fill="var(--sp,#14705f)"/>
  <text class="ts sp" x="772" y="182">cleared on the next real progress</text>

  <text class="ts mu" x="150" y="378">Progress is measured against the highest position ever committed, so a drain that keeps re-reading old ground cannot masquerade as healthy.</text>
  <text class="ts mu" x="150" y="396">Setting the key to 0 disables the detector entirely.</text>
  <text class="ts mu" x="150" y="414">Every option above is a bondy.conf key; values shown are the defaults.</text>
</svg>
