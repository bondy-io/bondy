<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sp,#14705f)"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--mu,#6b6862)"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--mu,#6b6862)" stroke-width="1.6" opacity=".45"/>
    </pattern>
  </defs>

  <style>
    /* Self-sufficient palette. A plate embedded as an image renders in its own
       document, so the host page's custom properties cannot reach it — these
       are the values that apply standalone, in either theme. When the plate is
       inlined into a page instead, this block is dropped and the page's own
       tokens drive the same var() references. */
    :root{--ik:#0b0b0c;--pa:#f1efec;--mu:#6b6862;--sp:#14705f;--ru:#d9d5cf}
    @media (prefers-color-scheme:dark){
      :root{--ik:#eeece8;--pa:#121415;--mu:#9a968f;--sp:#5fd6b4;--ru:#2c3032}
    }

    .ink   { fill: var(--ik,#0b0b0c); }
    .mu    { fill: var(--mu,#6b6862); }
    .sp    { fill: var(--sp,#14705f); }
    .box   { fill: none; stroke: var(--ik,#0b0b0c); stroke-width: 1.4; }
    .fill  { fill: var(--pa,#f1efec); stroke: var(--ik,#0b0b0c); stroke-width: 1.4; }
    .axis  { stroke: var(--mu,#6b6862); stroke-width: 1; }
    .cfg   { stroke: var(--sp,#14705f); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .cfgbx { fill: var(--sp,#14705f); fill-opacity: .10; stroke: var(--sp,#14705f); stroke-width: 1; }
    .t     { font-size: 12px; }
    .ts    { font-size: 10.5px; }
    .tt    { font-size: 11.5px; font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .tb    { font-size: 13.5px; font-weight: 600; }
    .tk    { font-size: 10.5px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; }
  </style>

  <rect width="100%" height="100%" fill="var(--pa,#f1efec)"/>


  <text class="tb ink" x="40" y="34">Write-ahead log — segment geometry</text>
  <text class="ts mu"  x="40" y="52">bondy_oplog_wal · one .qdata file per segment, byte axis not to scale</text>

  <!-- ================= Panel A : segment file ================= -->
  <rect class="fill" x="90" y="96" width="44"  height="46"/>
  <rect x="90" y="96" width="44" height="46" fill="url(#hatch)" stroke="none"/>
  <rect class="fill" x="134" y="96" width="116" height="46"/>
  <rect class="fill" x="250" y="96" width="130" height="46"/>
  <rect class="fill" x="380" y="96" width="90"  height="46"/>
  <rect class="fill" x="470" y="96" width="140" height="46"/>
  <rect class="fill" x="610" y="96" width="90"  height="46"/>
  <rect x="700" y="96" width="130" height="46" fill="none" stroke="var(--mu,#6b6862)" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text class="tk ink" x="112" y="124" text-anchor="middle">hdr</text>
  <text class="tt ink" x="192" y="124" text-anchor="middle">frame</text>
  <text class="tt ink" x="315" y="124" text-anchor="middle">frame</text>
  <text class="tt ink" x="425" y="124" text-anchor="middle">frame</text>
  <text class="tt ink" x="540" y="124" text-anchor="middle">batch frame</text>
  <text class="tt ink" x="655" y="124" text-anchor="middle">frame</text>
  <text class="ts mu"  x="765" y="124" text-anchor="middle">free</text>

  <!-- frame internal structure callout -->
  <line class="axis" x1="470" y1="146" x2="470" y2="170"/>
  <line class="axis" x1="610" y1="146" x2="610" y2="170"/>
  <rect class="fill" x="470" y="170" width="30"  height="26"/>
  <rect class="fill" x="500" y="170" width="110" height="26"/>
  <text class="ts ink" x="485" y="187" text-anchor="middle">16 B</text>
  <text class="ts ink" x="555" y="187" text-anchor="middle">body — [E1..EN]</text>
  <text class="ts mu"  x="620" y="187">one atomic batch: all events land, or none</text>

  <!-- byte axis -->
  <line class="axis" x1="90" y1="222" x2="830" y2="222"/>
  <line class="axis" x1="90" y1="217" x2="90" y2="227"/>
  <line class="axis" x1="134" y1="217" x2="134" y2="227"/>
  <line class="axis" x1="830" y1="217" x2="830" y2="227"/>
  <path d="M405 216 l8 12 M417 216 l8 12" stroke="var(--mu,#6b6862)" stroke-width="1.2" fill="none"/>
  <text class="ts mu" x="90"  y="242" text-anchor="middle">0</text>
  <text class="ts mu" x="134" y="242" text-anchor="middle">48</text>
  <text class="ts mu" x="830" y="242" text-anchor="middle">64 MB</text>
  <text class="ts mu" x="40"  y="226">bytes</text>

  <!-- rotation threshold -->
  <line class="cfg" x1="830" y1="54" x2="830" y2="212"/>
  <rect class="cfgbx" x="700" y="30" width="216" height="22" rx="4"/>
  <text class="tk sp" x="708" y="45">db.wal.max_segment_bytes = 64MB</text>
  <text class="ts mu" x="700" y="264" >rotation happens between appends — a batch never spans a boundary,</text>
  <text class="ts mu" x="700" y="278" >so the threshold is a soft target</text>

  <!-- durable / head markers -->
  <path d="M610 96 l-6 -14 h12 z" class="sp"/>
  <path d="M700 96 l-6 -14 h12 z" class="ink"/>
  <text class="tk sp"  x="610" y="72" text-anchor="middle">durable</text>
  <text class="tk ink" x="700" y="72" text-anchor="middle">head</text>
  <line x1="610" y1="160" x2="700" y2="160" class="axis" marker-start="url(#arm)" marker-end="url(#arm)"/>
  <text class="ts mu" x="655" y="153" text-anchor="middle">un-fsynced window</text>

  <!-- ================= Panel B : durability timing ================= -->
  <line x1="40" y1="310" x2="920" y2="310" stroke="var(--ru,#d6d2cc)" stroke-width="1"/>
  <text class="tb ink" x="40" y="344">Durability — when fsync happens</text>
  <rect class="cfgbx" x="330" y="328" width="266" height="22" rx="4"/>
  <text class="tk sp" x="338" y="343">db.wal.fsync_mode = per_write | batched</text>

  <!-- lane 1 : per_write -->
  <text class="t ink" x="40" y="392">per_write</text>
  <text class="ts mu" x="40" y="408">default</text>
  <line class="axis" x1="150" y1="400" x2="830" y2="400"/>
  <g class="mu">
    <rect x="170" y="388" width="46" height="24" class="fill"/>
    <rect x="256" y="388" width="46" height="24" class="fill"/>
    <rect x="342" y="388" width="46" height="24" class="fill"/>
    <rect x="428" y="388" width="46" height="24" class="fill"/>
  </g>
  <text class="ts ink" x="193" y="404" text-anchor="middle">w</text>
  <text class="ts ink" x="279" y="404" text-anchor="middle">w</text>
  <text class="ts ink" x="365" y="404" text-anchor="middle">w</text>
  <text class="ts ink" x="451" y="404" text-anchor="middle">w</text>
  <g stroke="var(--sp,#14705f)" stroke-width="2">
    <line x1="216" y1="380" x2="216" y2="420"/>
    <line x1="302" y1="380" x2="302" y2="420"/>
    <line x1="388" y1="380" x2="388" y2="420"/>
    <line x1="474" y1="380" x2="474" y2="420"/>
  </g>
  <text class="ts sp" x="500" y="404">fsync after every write — head ≡ durable, await_durable/3 returns at once</text>

  <!-- lane 2 : batched -->
  <text class="t ink" x="40" y="486">batched</text>
  <line class="axis" x1="150" y1="494" x2="830" y2="494"/>
  <g>
    <rect x="170" y="482" width="34" height="24" class="fill"/>
    <rect x="204" y="482" width="34" height="24" class="fill"/>
    <rect x="238" y="482" width="34" height="24" class="fill"/>
    <rect x="272" y="482" width="34" height="24" class="fill"/>
    <rect x="306" y="482" width="34" height="24" class="fill"/>
    <rect x="380" y="482" width="34" height="24" class="fill"/>
    <rect x="414" y="482" width="34" height="24" class="fill"/>
    <rect x="448" y="482" width="34" height="24" class="fill"/>
  </g>
  <line x1="340" y1="474" x2="340" y2="514" stroke="var(--sp,#14705f)" stroke-width="2"/>
  <line x1="482" y1="474" x2="482" y2="514" stroke="var(--sp,#14705f)" stroke-width="2"/>
  <line x1="170" y1="466" x2="340" y2="466" class="axis" marker-start="url(#arm)" marker-end="url(#arm)"/>
  <text class="ts mu" x="255" y="459" text-anchor="middle">1 MB accumulated  →  fsync</text>
  <line x1="380" y1="466" x2="482" y2="466" class="axis" marker-start="url(#arm)" marker-end="url(#arm)"/>
  <text class="ts mu" x="431" y="459" text-anchor="middle">50 ms elapsed  →  fsync</text>
  <text class="ts sp" x="500" y="498">whichever trigger fires first; head may lead durable by one window</text>

  <rect class="cfgbx" x="150" y="528" width="252" height="22" rx="4"/>
  <text class="tk sp" x="158" y="543">db.wal.batched_fsync_bytes = 1MB</text>
  <rect class="cfgbx" x="414" y="528" width="286" height="22" rx="4"/>
  <text class="tk sp" x="422" y="543">db.wal.batched_fsync_interval = 50ms</text>
  <text class="ts mu" x="40" y="576">Every option above is a bondy.conf key; values shown are the defaults.</text>
</svg>
