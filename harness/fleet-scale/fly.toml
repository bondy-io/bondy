# =============================================================================
# Fleet-scale cluster -- N-node Bondy sized for the "500K vehicles, each on
# its own topic; a user subscribes to 2K vehicles" scenario. Reuses the
# proven M0 image (harness/m0-fly-spike/Dockerfile).
#
# Deploy from the REPO ROOT (build context = repo root for `COPY . /bondy/src`):
#   fly deploy --config harness/fleet-scale/fly.toml \
#              --dockerfile harness/fleet-scale/Dockerfile --remote-only
# run-fleet.sh does all of this. [[files]] local_path is deploy-CWD-relative
# (repo root), so the paths below are repo-root-relative.
# =============================================================================

app            = "bondy-fleet-1"
primary_region = "lhr"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[experimental]
  entrypoint = ["/bin/bash", "-c", "source /bondy/setup.sh"]

[env]
  BONDY_DATA_DIR                = "/bondy/data"
  BONDY_ETC_DIR                 = "/bondy/etc"
  BONDY_ERL_DISTRIBUTED_COOKIE  = "bondy"
  BONDY_LOG_LEVEL                = "info"
  ERL_CRASH_DUMP                = "/dev/null"
  ERL_DIST_PORT                 = "27784"

# Public WAMP-over-WebSocket endpoint. Fly's edge terminates TLS on 443 and
# forwards to internal 18080 (cleartext WS), so clients use wss://<app>.fly.dev/ws.
[http_service]
  internal_port        = 18080
  auto_stop_machines   = false
  auto_start_machines  = false
  min_machines_running = 5

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 200000
    soft_limit = 200000

[[services]]
  protocol      = "tcp"
  internal_port = 18081                 # admin API: /ping /ready /metrics

  [services.concurrency]
    type       = "connections"
    hard_limit = 1024
    soft_limit = 1024

[checks]
  [checks.admin-http-alive]
    port         = 18081
    type         = "http"
    interval     = "15s"
    timeout      = "10s"
    grace_period = "60s"
    method       = "get"
    path         = "/ping"

[[files]]
  guest_path = "/bondy/setup.sh"
  local_path = "harness/fleet-scale/setup.sh"

[[files]]
  guest_path = "/bondy/etc/bondy.conf.template"
  local_path = "harness/fleet-scale/config/bondy.conf.template"

[[files]]
  guest_path = "/bondy/etc/security_config.json"
  local_path = "harness/fleet-scale/config/security_config.json"

[[metrics]]
  port = 18081
  path = "/metrics"

# performance-8x: Bondy's own per-connection footprint is lean (a session is
# a small Erlang process, no dealer/subscription state for a publisher-only
# connection), so cores/scheduling -- not RAM -- is the node-sizing driver.
[[vm]]
  size   = "performance-8x"
  memory = "16gb"
