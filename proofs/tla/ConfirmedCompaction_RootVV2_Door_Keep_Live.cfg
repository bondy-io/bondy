\* Convergence when the door drops nothing (DoorRule = "keep"): two
\* replicas that both compacted re-ship a confirmed event to each other
\* forever. Expect Convergence violated.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 0
    Rule = "rootvv"
    AsyncApply = TRUE
    Sweep = "all"
    Witnesses = "members"
    MaxCuts = 0
    MaxRetire = 0
    DoorRule = "keep"
    MaxDepth = 0
    CapAtUnapplied = TRUE
PROPERTIES Convergence
