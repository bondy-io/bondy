\* THE MODEL, no skew: every unroutable bucket is a TRANSIENT registration window.
SPECIFICATION FairSpec

CONSTANTS
    Replicas = {r1, r2}
    Buckets = {b1, b2}
    MaxSeq = 2
    SkipIsHole = TRUE
    ContigClaim = TRUE
    GateOnRegistration = TRUE
    ServeGate = TRUE
    AdoptIfComplete = TRUE
    GapVerdict = TRUE
    VersionSkew = FALSE
    SkewReplica = r2
    SkewBucket = b2

INVARIANT
    TypeOK
    NoOverClaim
    NoStrandedCell

PROPERTY
    Live

CHECK_DEADLOCK FALSE
