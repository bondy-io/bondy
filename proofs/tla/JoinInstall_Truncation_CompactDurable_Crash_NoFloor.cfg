\* As JoinInstall_Truncation_CompactDurable_Crash.cfg without "floor": a
\* restore of the claims after a crash may drop recorded truncated events.
\* Recorded as violating CompactedClaimed:
\* apps/bondy_oplog/src/bondy_oplog_registry.erl, doc of replace_frontier/2.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 2
    Reap = FALSE
    MaxInstalls = 1
    InstallMode = "stage"
    MaxCrashes = 1
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "early", "busy", "token", "trunc", "coverbegin"}
    CompactBy = "durable"
    RetiredExempt = FALSE
    BoundMode = "first_unconfirmed"
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
