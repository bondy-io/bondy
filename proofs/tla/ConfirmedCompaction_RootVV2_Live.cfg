\* Liveness of the rule under proof on the ETS backend, applier-backed,
\* weak fairness only. Expect clean: the VV witness survives both the page
\* GC and the peer's own pull, so once a peer has applied a prefix every
\* later round certifies it and a truncation stays possible until taken.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 0
    Rule = "rootvv"
    AsyncApply = TRUE
    Sweep = "all"
    CapAtUnapplied = TRUE
PROPERTIES Convergence
