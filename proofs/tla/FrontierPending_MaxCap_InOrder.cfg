\* In-order delivery removes the contiguity channel and leaves the bucket-skip channel: the batch that fails seq 1 is not the batch that folds seq 2. EXPECT: NoOverClaim VIOLATED.
SPECIFICATION Spec

CONSTANTS
    Origins = {o1}
    Buckets = {b1, b2}
    MaxSeq = 3
    Unroutable = b2
    ClaimRule = "MaxCap"
    InOrderDelivery = TRUE
    WholeBatchOnly = FALSE
    CanHeal = TRUE
    CanRefold = TRUE
    CanRestart = FALSE
    DoorTruncates = TRUE
    TruncatePrefixOnly = TRUE
    DoorUsesPending = FALSE

INVARIANTS TypeOK NoOverClaim
