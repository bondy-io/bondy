\* The full re-bootstrap order, with one failed install write that is logged
\* and the cell counted installed (WriteFailAborts = FALSE). Two replicas,
\* one fault, one failed trailing round.
\* Checks TypeOK, NoStrandedEvent, ClaimSound and Converges.
\* No recorded result.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 2
    UnconditionalInstall = TRUE
    RederiveEarly = TRUE
    DurableMarker = TRUE
    ServeGuard = TRUE
    ReplaceFrontier = TRUE
    MaxFaults = 1
    MaxTrailFails = 1
    MaxCrashes = 0
    MaxWriteFails = 1
    WriteFailAborts = FALSE
INVARIANT TypeOK
INVARIANT NoStrandedEvent
INVARIANT ClaimSound
PROPERTY Converges
CHECK_DEADLOCK FALSE
