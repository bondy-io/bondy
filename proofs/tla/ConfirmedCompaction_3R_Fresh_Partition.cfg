\* The code with a recency filter on the witnesses, under a partition: a
\* row no round has refreshed is dropped, so two replicas cut off from the
\* third compact with each other alone.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxSeq = 1
    Skew = 0
    AsyncApply = FALSE
    Witnesses = "fresh"
    MaxCuts = 2
    MaxRetire = 0
    DoorRule = "confirmed"
    MaxDepth = 0
    CapAtUnapplied = TRUE
    MaxLost = 0
    WalkLost = FALSE
    HealGate = "dominate"
    HealCap = TRUE
    FusedHold = FALSE
INVARIANTS TypeOK NoLoss PrefixClosed
PROPERTIES NoDrop
CHECK_DEADLOCK FALSE
