\* Reap guarded by universal retirement, with log compaction and membership
\* churn allowed, MaxSeq = 1. Adds NoStuckEvent to the safety invariants.
\* Recorded: NoStuckEvent violated, in README.md, "What the universal guard
\* does not cover".
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    ReapEnabled = TRUE
    ReapRule = "universal"
    CompactionModelled = TRUE
    StableMembership = FALSE
    RetirementDurable = TRUE
    BanEnforced = TRUE

INVARIANTS
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
    RetiredSkipIsSafe
    NoStuckEvent

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
