\* Reap guarded by universal retirement; ban enforced, retirement durable,
\* membership churn allowed, no log compaction, MaxSeq = 2. Checks TypeOK,
\* NoOverClaim, NoDataLoss, SpuriousGap and RetiredSkipIsSafe.
\* Recorded exhaustive clean in README.md,
\* "Frontier reaping: what survives a node coming back".
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 2
    ReapEnabled = TRUE
    ReapRule = "universal"
    CompactionModelled = FALSE
    StableMembership = FALSE
    RetirementDurable = TRUE
    BanEnforced = TRUE

INVARIANTS
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
    RetiredSkipIsSafe

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
