\* Liveness of the shipped rule on the ETS backend under WEAK fairness of
\* every scheduled activity. Expect Convergence violated: the page GC
\* after each door pass unreads the root just recorded whenever the trees
\* differ, and the peer's pull overwrites the confirmed root, so a
\* truncation is never continuously possible.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 0
    Rule = "root"
    AsyncApply = FALSE
    Sweep = "all"
    Witnesses = "members"
    MaxCuts = 0
    MaxRetire = 0
    DoorRule = "drop"
    MaxDepth = 0
    CapAtUnapplied = FALSE
PROPERTIES Convergence
