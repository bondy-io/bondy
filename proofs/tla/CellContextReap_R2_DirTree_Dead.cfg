\* Two replicas, reap on, causal delivery, Directory = "tree". Checks the safety
\* invariants and DeadContextReachable; it omits DirectoryComplete. Recorded:
\* DeadContextReachable violated in 3 steps (proofs/tla/README.md, "Cell-context
\* reaping" section).
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 1
    ReapEnabled = TRUE
    CausalDelivery = TRUE
    Directory = "tree"

INVARIANTS
    TypeOK
    NoResurrection
    Convergence
    NoPhantomDot
    ContextCoversDots
    DeadContextReachable

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
