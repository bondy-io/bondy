\* The rule under proof at three replicas: every row constrains, a
\* rootless row by its (zero) VV. Expect exhaustive clean.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxSeq = 1
    Skew = 0
    Rule = "rootvv"
    AsyncApply = FALSE
    Sweep = "none"
    Witnesses = "members"
    MaxCuts = 0
    MaxRetire = 0
    CapAtUnapplied = FALSE
INVARIANTS TypeOK NoLoss PrefixClosed NoHeld
PROPERTIES NoDrop RoundConfirmsApplied
