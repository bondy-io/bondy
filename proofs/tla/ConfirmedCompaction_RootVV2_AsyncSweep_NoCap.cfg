\* The rule under proof, applier-backed, WITHOUT the truncation cap: the
\* shipped truncation sites. Expect NoDrop violated — an event the door
\* held below the watermark is dropped un-folded by the next compaction
\* tick if the applier has not replayed it yet. Independent of Rule.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 1
    Rule = "rootvv"
    AsyncApply = TRUE
    Sweep = "all"
    CapAtUnapplied = FALSE
INVARIANTS TypeOK NoLoss PrefixClosed
PROPERTIES NoDrop
