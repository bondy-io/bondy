\* Reap guarded by the meet rule with the ban NOT enforced; retirement
\* durable, membership churn allowed, no log compaction, MaxSeq = 1. Checks
\* TypeOK, NoOverClaim, NoDataLoss, SpuriousGap and RetiredSkipIsSafe.
\* Recorded: RetiredSkipIsSafe violated, in README.md,
\* "Frontier reaping: what survives a node coming back".
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    ReapEnabled = TRUE
    ReapRule = "meet"
    CompactionModelled = FALSE
    StableMembership = FALSE
    RetirementDurable = TRUE
    BanEnforced = FALSE

INVARIANTS
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
    RetiredSkipIsSafe

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
