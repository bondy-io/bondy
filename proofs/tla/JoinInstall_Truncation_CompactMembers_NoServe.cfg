\* The shipped base without the serve guard: a source that is itself
\* installing serves a snapshot.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 2
    Reap = FALSE
    MaxInstalls = 2
    InstallMode = "stage"
    MaxCrashes = 0
    RefoldFirst = TRUE
    HlcGuards = {"mark", "replayed", "target", "early", "busy", "token", "trunc", "coverbegin", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
    BoundMode = "first_unconfirmed"
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
