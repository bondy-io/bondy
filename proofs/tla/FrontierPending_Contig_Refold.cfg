\* The repair shipped today: a re-fold re-presents the whole oplog, so the forgotten seq is folded again alongside the seq that filled the hole and the entry catches up. Clean -- at the cost of an O(live MST) fold.
SPECIFICATION FairSpec

CONSTANTS
    Origins = {o1}
    Buckets = {b1, b2}
    MaxSeq = 3
    Unroutable = b2
    ClaimRule = "Contig"
    InOrderDelivery = FALSE
    WholeBatchOnly = FALSE
    CanHeal = TRUE
    CanRefold = TRUE
    CanRestart = FALSE
    DoorTruncates = TRUE
    TruncatePrefixOnly = TRUE
    DoorUsesPending = FALSE

PROPERTY EventuallyComplete
