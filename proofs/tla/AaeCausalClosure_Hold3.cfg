\* THE FIX at 3-replica scope: same constants as AaeCausalClosure_Hold.cfg
\* but Replicas = {r1, r2, r3}. The sync/hold/frontier logic is pairwise,
\* so the 2-replica run is the protocol-shaped one; this run checks that
\* triangular interleavings (r2 and r3 compacting/rebootstrapping around
\* r1's holds) add no violation. Full exhaustion is impractical; results
\* on record (2026-08-05, both clean): BFS to depth 18 / 25.2M distinct
\* states, and -simulate num=200000 -depth 40 (800k traces, 321M states
\* checked). See proofs/tla/README.md.
SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 2
    GapCheckEnabled = TRUE
    PrefixHold = TRUE
    GatedCompaction = FALSE

INVARIANT
    TypeOK
    NoOverClaim
    PrefixClosed
