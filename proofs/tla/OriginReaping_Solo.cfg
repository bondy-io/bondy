\* THE CARVE-OUT: reap only when this replica is the sole member, which is
\* the case `reclamation_members/0` already documents as licensing maximal
\* reclamation. Expected: clean.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 2
    ReapEnabled = TRUE
    MeetGated = FALSE
    SoloOnly = TRUE
INVARIANT
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
