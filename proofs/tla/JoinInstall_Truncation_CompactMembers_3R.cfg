\* Compaction by the code's rule (every other member confirms by its claims),
\* as JoinInstall_Truncation_CompactMembers.cfg with three replicas.
\* Checks SettledSound, SomeoneServes, CompactedClaimed, NoStrandedRecord.
\* No recorded result.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    MaxEvents = 2
    Reap = FALSE
    MaxInstalls = 1
    InstallMode = "stage"
    MaxCrashes = 0
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "early", "busy", "token", "trunc", "coverbegin", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
    BoundMode = "first_unconfirmed"
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
