\* THE REPRESENTATION FIX: the claim is the per-origin CONTIGUOUS PREFIX
\* BOUND of what the replica APPLIED, and the peer's claim is never adopted.
\* Same wire type as today (one integer per origin). Compaction UNGATED --
\* the recency-filtered reality that violates the baseline in 6 steps.
\*
\* Checks NoOverClaim only. PrefixClosed is NOT expected to hold: holes still
\* form, and after proofs/isabelle/Dot_Exactness_Gapped.thy they no longer
\* need to be absent for dot_observed to be exact.
SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 2
    GapCheckEnabled = TRUE
    PrefixHold = FALSE
    ContigClaim = TRUE
    GatedCompaction = FALSE

INVARIANT
    TypeOK
    NoOverClaim
