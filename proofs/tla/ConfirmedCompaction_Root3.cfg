\* The shipped rule at three replicas. A row whose root is undefined
\* constrains nothing (bondy_oplog_compaction:compact/1), so a member that
\* has completed rounds only against empty trees is compacted past.
\* Expect NoLoss violated.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxSeq = 1
    Skew = 0
    Rule = "root"
    AsyncApply = FALSE
    Sweep = "none"
    CapAtUnapplied = FALSE
INVARIANTS TypeOK NoLoss PrefixClosed NoHeld
PROPERTIES NoDrop
