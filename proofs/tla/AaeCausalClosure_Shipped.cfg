\* The shipped combination: the prefix hold at the fold, the per-origin
\* contiguous claim never adopted from a peer, the gap check, and compaction
\* that does not wait for every replica (mst_retention, truncate_prefix).
\* Two replicas: sync, hold and frontier logic are pairwise.
SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 2
    GapCheckEnabled = TRUE
    PrefixHold = TRUE
    ContigClaim = TRUE
    GatedCompaction = FALSE

INVARIANT
    TypeOK
    NoOverClaim
    PrefixClosed
