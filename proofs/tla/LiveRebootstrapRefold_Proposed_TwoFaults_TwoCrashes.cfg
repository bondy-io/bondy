\* The full re-bootstrap order: unconditional install, early re-fold,
\* durable mark, serve guard and frontier reset all on.
\* Two replicas, MaxSeq = 1, two faults, one failed trailing round, two
\* crashes. Checks TypeOK, NoStrandedEvent, ClaimSound and Converges.
\* No recorded result.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    UnconditionalInstall = TRUE
    RederiveEarly = TRUE
    DurableMarker = TRUE
    ServeGuard = TRUE
    ReplaceFrontier = TRUE
    MaxFaults = 2
    MaxTrailFails = 1
    MaxCrashes = 2
    MaxWriteFails = 0
    WriteFailAborts = TRUE
INVARIANT TypeOK
INVARIANT NoStrandedEvent
INVARIANT ClaimSound
PROPERTY Converges
CHECK_DEADLOCK FALSE
