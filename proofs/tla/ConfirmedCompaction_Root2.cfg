\* THE SHIPPED RULE, fused instance, pack backend (no page GC between
\* rounds): compaction certifies a peer by its recorded ROOT only.
\* Expect RoundConfirmsApplied violated: a peer that compacted a prefix it
\* applied leaves the next round unable to certify it.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 1
    Rule = "root"
    AsyncApply = FALSE
    Sweep = "none"
    CapAtUnapplied = FALSE
INVARIANTS TypeOK NoLoss PrefixClosed NoHeld
PROPERTIES NoDrop RoundConfirmsApplied
