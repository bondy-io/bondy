\* Two origins on one instance, to check the pointwise reduction the Isabelle theory relies on: one origin's hole must not disturb the other's entry. Smaller MaxSeq to keep it exhaustive.
SPECIFICATION Spec

CONSTANTS
    Origins = {o1, o2}
    Buckets = {b1, b2}
    MaxSeq = 2
    Unroutable = b2
    ClaimRule = "Pending"
    InOrderDelivery = FALSE
    WholeBatchOnly = FALSE
    CanHeal = TRUE
    CanRefold = FALSE
    CanRestart = FALSE
    DoorTruncates = TRUE
    TruncatePrefixOnly = TRUE
    DoorUsesPending = FALSE

INVARIANTS TypeOK NoOverClaim PendingSound NoLoss Exact Complete
