\* HLC stamps; across a reboot the wall clock may step back, but not past a
\* stamp a replica holds (AssumeWallAhead). One peer. Checks SettledCellIsTruth
\* and SettledStubIsTruth. Recorded: exhaustive clean (proofs/tla/README.md,
\* "`RibAbs.tla`, `RibReading.tla`" section).
CONSTANTS
    Peers = {p1}
    MaxStamp = 6
    K = 2
    MaxWall = 3
    StepBack = 2
    AssumeWallAhead = TRUE
    MaxOps = 2
    MaxResets = 2
    SelfHealEnabled = TRUE
    ReapEnabled = TRUE
    SweepOnce = TRUE
    HealOnAbsent = FALSE
    HealOnForeignTop = FALSE
    HealAlways = TRUE
    StubFollowsCell = FALSE
    Durable = FALSE
    ReopenEnabled = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK SettledCellIsTruth SettledStubIsTruth
CHECK_DEADLOCK FALSE
