\* The rule under proof on the applier-backed instance (remote events
\* folded by a separate Replay step) with the ETS page GC on every
\* truncation. NoHeld is not expected here: an event delivered below the
\* watermark is held until Replay folds it. Expect the rest clean.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 1
    Rule = "rootvv"
    AsyncApply = TRUE
    Sweep = "all"
    CapAtUnapplied = TRUE
INVARIANTS TypeOK NoLoss PrefixClosed
PROPERTIES NoDrop RoundConfirmsApplied
