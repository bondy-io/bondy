\* Compaction by the code's rule: every other member confirms by its claims.
\* Two replicas, one staged install, no crash; guards incl. "trunc",
\* "coverbegin", "floor". Checks the four safety invariants and
\* NoStuckTombstone. Recorded as holding CompactedClaimed and NoStrandedRecord:
\* apps/bondy_oplog/src/bondy_oplog_instance.erl, docs of begin_install/3
\* and compaction_witnesses/1.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 2
    Reap = FALSE
    MaxInstalls = 1
    InstallMode = "stage"
    MaxCrashes = 0
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "early", "busy", "token", "trunc", "coverbegin", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
    BoundMode = "first_unconfirmed"
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord NoStuckTombstone
SYMMETRY Sym
CHECK_DEADLOCK FALSE
