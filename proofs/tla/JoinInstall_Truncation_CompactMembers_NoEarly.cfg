\* The shipped base without the early mark: the mark is written at install,
\* not when the session opens.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 2
    Reap = FALSE
    MaxInstalls = 2
    InstallMode = "stage"
    MaxCrashes = 0
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "busy", "token", "trunc", "coverbegin", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
    BoundMode = "first_unconfirmed"
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
