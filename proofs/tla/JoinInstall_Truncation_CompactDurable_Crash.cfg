\* Compaction confirmed by every member's checkpointed claims, the replica's
\* own included ("durable"), with one crash, and "floor": a restore of the
\* claims keeps the events the replica recorded as truncated. Recorded as
\* holding CompactedClaimed: apps/bondy_oplog/src/bondy_oplog_registry.erl,
\* doc of replace_frontier/2.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 2
    Reap = FALSE
    MaxInstalls = 1
    InstallMode = "stage"
    MaxCrashes = 1
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "early", "busy", "token", "trunc", "coverbegin", "floor"}
    CompactBy = "durable"
    RetiredExempt = FALSE
    BoundMode = "first_unconfirmed"
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
