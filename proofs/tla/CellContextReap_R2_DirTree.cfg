\* Two replicas, reap on, causal delivery; the reaper sees the cells the MST
\* walk lists (Directory = "tree"). Checks the safety invariants plus
\* DirectoryComplete and DeadContextReachable. Recorded: DirectoryComplete
\* violated in 3 steps (proofs/tla/README.md, "Cell-context reaping" section).
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 1
    ReapEnabled = TRUE
    CausalDelivery = TRUE
    Directory = "tree"

INVARIANTS
    TypeOK
    NoResurrection
    Convergence
    NoPhantomDot
    ContextCoversDots
    DirectoryComplete
    DeadContextReachable

SPECIFICATION Spec
