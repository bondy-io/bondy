\* THE MODEL. All five mechanisms, permanent version skew: a bucket SkewReplica's build has no table for.
SPECIFICATION FairSpec

CONSTANTS
    Replicas = {r1, r2}
    Buckets = {b1, b2}
    MaxSeq = 2
    SkipIsHole = TRUE
    ContigClaim = TRUE
    GateOnRegistration = TRUE
    ServeGate = TRUE
    AdoptIfComplete = TRUE
    GapVerdict = TRUE
    VersionSkew = TRUE
    SkewReplica = r2
    SkewBucket = b2

INVARIANT
    TypeOK
    NoOverClaim
    NoStrandedCell

PROPERTY
    Live

CHECK_DEADLOCK FALSE
