\* The representation fix at the PAIRWISE scope, for the same reason
\* AaeCausalClosure_Hold.cfg uses two replicas: sync, claim and gap logic
\* are all pairwise, and the 3-replica space explodes once a firing gap
\* check makes Rebootstrap reachable from most states.
SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 2
    GapCheckEnabled = TRUE
    PrefixHold = FALSE
    ContigClaim = TRUE
    GatedCompaction = FALSE

INVARIANT
    TypeOK
    NoOverClaim
