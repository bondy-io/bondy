\* Two replicas, MaxSeq = 2, reap on, causal delivery; the reaper sees the keys
\* the adapter enumerates (Directory = "projection"). Checks all seven
\* invariants. Recorded: clean on every invariant (proofs/tla/README.md, "Cell-
\* context reaping" section).
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    ReapEnabled = TRUE
    CausalDelivery = TRUE
    Directory = "projection"

INVARIANTS
    TypeOK
    NoResurrection
    Convergence
    NoPhantomDot
    ContextCoversDots
    DirectoryComplete
    DeadContextReachable

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
