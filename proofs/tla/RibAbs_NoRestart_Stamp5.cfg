\* The shipped policy without instance restarts. Two peers, stamps up to 5.
\* Checks SettledCellIsTruth and SettledStubIsTruth. Recorded: exhaustive clean
\* (proofs/tla/README.md, "`RibAbs.tla`, `RibReading.tla`" section).
CONSTANTS
    Peers = {p1, p2}
    MaxOps = 2
    MaxResets = 2
    MaxStamp = 5
    SelfHealEnabled = TRUE
    ReapEnabled = TRUE
    SweepOnce = TRUE
    HealOnAbsent = FALSE
    HealOnForeignTop = FALSE
    HealAlways = TRUE
    StubFollowsCell = FALSE
    Durable = FALSE
    ReopenEnabled = TRUE
    ClockRegress = FALSE
    RestartEnabled = FALSE
    RestartRestore = FALSE
    RestartReopens = FALSE

SPECIFICATION Spec
INVARIANTS
    TypeOK
    SettledCellIsTruth
    SettledStubIsTruth
CHECK_DEADLOCK FALSE
SYMMETRY PeerSym
