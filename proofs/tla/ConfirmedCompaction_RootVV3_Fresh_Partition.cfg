\* THE SHIPPED WITNESS SET under a partition: a row older than
\* peer_timeout_ms is dropped, so two replicas cut off from the third
\* compact with each other alone. Expect NoLoss violated.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxSeq = 1
    Skew = 0
    Rule = "rootvv"
    AsyncApply = FALSE
    Sweep = "none"
    Witnesses = "fresh"
    MaxCuts = 2
    MaxRetire = 0
    CapAtUnapplied = TRUE
INVARIANTS TypeOK NoLoss PrefixClosed
PROPERTIES NoDrop
CHECK_DEADLOCK FALSE
