\* Differential: compaction gated on every replica having APPLIED the
\* truncated prefix (i.e. no recency filter, no mst_retention).
SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 2
    GapCheckEnabled = TRUE
    PrefixHold = FALSE
    GatedCompaction = TRUE

INVARIANT
    TypeOK
    NoOverClaim
    PrefixClosed
