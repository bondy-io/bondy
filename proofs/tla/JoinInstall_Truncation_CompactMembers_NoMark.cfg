\* The shipped base without the install mark: a crash after an install
\* restarts trusting a frontier its cell does not reflect.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 3
    Reap = FALSE
    MaxInstalls = 1
    InstallMode = "stage"
    MaxCrashes = 1
    RefoldFirst = TRUE
    HlcGuards = {"serve", "replayed", "target", "early", "busy", "token", "trunc", "coverbegin", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
