\* NEGATIVE CONTROL: the frontier-gap verdict is withheld for a deficit this replica cannot close, so no re-bootstrap is ever triggered.
SPECIFICATION FairSpec

CONSTANTS
    Replicas = {r1, r2}
    Buckets = {b1, b2}
    MaxSeq = 2
    SkipIsHole = TRUE
    ContigClaim = TRUE
    GateOnRegistration = TRUE
    ServeGate = TRUE
    AdoptIfComplete = TRUE
    GapVerdict = FALSE
    VersionSkew = TRUE
    SkewReplica = r2
    SkewBucket = b2

INVARIANT
    TypeOK
    NoOverClaim
    NoStrandedCell

PROPERTY
    Live

CHECK_DEADLOCK FALSE
