\* The shipped universal rule without the ban: a retired origin's events are
\* still accepted after its frontier entry is reaped.
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    ReapEnabled = TRUE
    ReapRule = "universal"
    CompactionModelled = FALSE
    StableMembership = FALSE
    RetirementDurable = TRUE
    BanEnforced = FALSE

INVARIANTS
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
    RetiredSkipIsSafe

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
