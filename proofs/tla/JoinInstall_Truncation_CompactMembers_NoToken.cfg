\* The shipped base without the install token: a stage from a superseded
\* install is committed after a restart.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 3
    Reap = FALSE
    MaxInstalls = 1
    InstallMode = "stage"
    MaxCrashes = 1
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "early", "busy", "trunc", "coverbegin", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
