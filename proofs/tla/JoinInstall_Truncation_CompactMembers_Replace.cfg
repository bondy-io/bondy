\* The shipped base with the install written over the cell instead of staged:
\* a local write folds onto the installed cell before the re-fold.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 2
    MaxEvents = 3
    Reap = FALSE
    MaxInstalls = 1
    InstallMode = "replace"
    MaxCrashes = 0
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "early", "busy", "token", "trunc", "coverbegin", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
    BoundMode = "claims"
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
