\* WHAT THE TRUNCATION CAP IS BUYING. Sharpen the door AND drop the prefix cap, and the door truncates events recorded only in the volatile half; a restart drops that half and the re-fold cannot re-present what the tree no longer holds. EXPECT: EventuallyComplete VIOLATED -- a permanently stalled frontier, with no data lost. The cap is load-bearing for the sharpened test; the prefix test does not need it.
SPECIFICATION FairSpec

CONSTANTS
    Origins = {o1}
    Buckets = {b1, b2}
    MaxSeq = 3
    Unroutable = b2
    ClaimRule = "Pending"
    InOrderDelivery = FALSE
    WholeBatchOnly = FALSE
    CanHeal = TRUE
    CanRefold = TRUE
    CanRestart = TRUE
    DoorTruncates = TRUE
    TruncatePrefixOnly = FALSE
    DoorUsesPending = TRUE

PROPERTY EventuallyComplete
