\* Reap guarded by universal retirement, with log compaction and stable
\* membership, MaxSeq = 1. Adds NoStuckEvent to the safety invariants.
\* Recorded: NoStuckEvent clean, in README.md,
\* "Which precondition licenses the drop".
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    ReapEnabled = TRUE
    ReapRule = "universal"
    CompactionModelled = TRUE
    StableMembership = TRUE
    RetirementDurable = TRUE
    BanEnforced = TRUE

INVARIANTS
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
    RetiredSkipIsSafe
    NoStuckEvent

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
