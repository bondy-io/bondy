\* The re-bootstrap order, but the install keeps a local cell with a newer
\* HLC (UnconditionalInstall = FALSE). One fault, one failed trailing round.
\* Checks TypeOK, NoStrandedEvent, ClaimSound and Converges.
\* Cited as the counterexample for keeping a newer cell in "Bootstrap: how a
\* new replica joins",
\* apps/bondy_db/doc_extras/architecture/06_compaction_and_bootstrap.md.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 2
    UnconditionalInstall = FALSE
    RederiveEarly = TRUE
    DurableMarker = TRUE
    ServeGuard = TRUE
    ReplaceFrontier = TRUE
    MaxFaults = 1
    MaxTrailFails = 1
    MaxCrashes = 0
    MaxWriteFails = 0
    WriteFailAborts = TRUE
INVARIANT TypeOK
INVARIANT NoStrandedEvent
INVARIANT ClaimSound
PROPERTY Converges
CHECK_DEADLOCK FALSE
