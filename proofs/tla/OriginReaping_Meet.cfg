\* THE CONTAINMENT-FRONTIER DISCIPLINE, the shape MST compaction already
\* uses: reap only what every member is known to hold at the same value (a
\* meet over confirmed peers), and let the deficit check apply the same
\* predicate. No agreement protocol -- a monotone function of confirmed
\* peer state, fail-closed on an unreachable peer.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 2
    ReapEnabled = TRUE
    MeetGated = TRUE
    SoloOnly = FALSE
INVARIANT
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
    ReapedMeansLevel
