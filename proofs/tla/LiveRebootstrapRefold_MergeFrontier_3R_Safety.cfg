\* The re-bootstrap order, but the rederive max-merges the old frontier
\* instead of resetting it (ReplaceFrontier = FALSE). Three replicas, two
\* faults, one failed trailing round, one crash.
\* Safety only: TypeOK, NoStrandedEvent, ClaimSound.
\* Recorded as failing in "Re-bootstrap ordering",
\* apps/bondy_db/doc_extras/architecture/06_compaction_and_bootstrap.md.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    UnconditionalInstall = TRUE
    RederiveEarly = TRUE
    DurableMarker = TRUE
    ServeGuard = TRUE
    ReplaceFrontier = FALSE
    MaxFaults = 2
    MaxTrailFails = 1
    MaxCrashes = 1
    MaxWriteFails = 0
    WriteFailAborts = TRUE
INVARIANT TypeOK
INVARIANT NoStrandedEvent
INVARIANT ClaimSound
CHECK_DEADLOCK FALSE
