\* Reap guarded by universal retirement, ban enforced, but a retirement can
\* be enforced before it is persisted and lost on restart
\* (RetirementDurable = FALSE). Churn allowed, no compaction, MaxSeq = 1.
\* Recorded: SpuriousGap violated, in README.md, "May a replica enforce a
\* retirement it has not persisted?".
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    ReapEnabled = TRUE
    ReapRule = "universal"
    CompactionModelled = FALSE
    StableMembership = FALSE
    RetirementDurable = FALSE
    BanEnforced = TRUE

INVARIANTS
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
    RetiredSkipIsSafe

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
