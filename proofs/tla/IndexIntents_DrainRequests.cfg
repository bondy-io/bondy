    Keys = {k1}
    Vals = {"none", "a"}
    MaxEvents = 2
    MaxBatch = 1
    MaxInstalls = 0
    MaxCrashes = 1
    MaxWriterCrashes = 1
    MaxSaturations = 1
    MaxCleanReopens = 0
