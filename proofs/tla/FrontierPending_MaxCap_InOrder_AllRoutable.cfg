\* The regime in which the shipped rule IS correct: delivery prefix-closed and every bucket routable, so every batch sees every absent seq below its claim. Exhaustive and clean -- the boundary of its soundness is a boundary, not a slope.
SPECIFICATION Spec

CONSTANTS
    Origins = {o1}
    Buckets = {b1, b2}
    MaxSeq = 3
    Unroutable = bNone
    ClaimRule = "MaxCap"
    InOrderDelivery = TRUE
    WholeBatchOnly = FALSE
    CanHeal = TRUE
    CanRefold = TRUE
    CanRestart = FALSE
    DoorTruncates = TRUE
    TruncatePrefixOnly = TRUE
    DoorUsesPending = FALSE

INVARIANTS TypeOK NoOverClaim NoLoss Complete
