\* As _2R_Async_Lost; DropsOnlyApplied is expected to be violated, which
\* shows a rebuild that drops an un-applied event is reached.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 0
    AsyncApply = TRUE
    Witnesses = "members"
    MaxCuts = 0
    MaxRetire = 0
    DoorRule = "confirmed"
    MaxDepth = 0
    CapAtUnapplied = TRUE
    MaxLost = 1
    WalkLost = FALSE
    HealGate = "dominate"
    HealCap = TRUE
    FusedHold = TRUE
INVARIANTS TypeOK PrefixClosed ConfirmedHeld NoErase
PROPERTIES DropsOnlyApplied
CHECK_DEADLOCK FALSE
