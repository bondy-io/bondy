\* As JoinInstall_Truncation_CompactMembers.cfg without "coverbegin": an
\* install may begin from a source whose frontier does not cover this
\* replica's truncation record. Recorded as violating CompactedClaimed:
\* apps/bondy_oplog/src/bondy_oplog_instance.erl, doc of begin_install/3.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 2
    Reap = FALSE
    MaxInstalls = 1
    InstallMode = "stage"
    MaxCrashes = 0
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "early", "busy", "token", "trunc", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
    BoundMode = "first_unconfirmed"
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
