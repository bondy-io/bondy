\* The fix WITHOUT the boot re-fold of increment 4: a restart drops the pending half and nothing re-presents what it recorded. EXPECT: EventuallyComplete VIOLATED -- the pending set does not make the re-fold redundant.
SPECIFICATION FairSpec

CONSTANTS
    Origins = {o1}
    Buckets = {b1, b2}
    MaxSeq = 3
    Unroutable = b2
    ClaimRule = "Pending"
    InOrderDelivery = FALSE
    WholeBatchOnly = FALSE
    CanHeal = TRUE
    CanRefold = FALSE
    CanRestart = TRUE
    DoorTruncates = TRUE
    TruncatePrefixOnly = TRUE
    DoorUsesPending = FALSE

PROPERTY EventuallyComplete
