\* Probe: can every member reap a retired origin under universal
\* retirement? Stable membership, no compaction. NotAllMembersReaped is
\* inverted: a violation is the good outcome. Recorded: violated, so every
\* member can reap; README.md,
\* "Which precondition licenses the drop".
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    ReapEnabled = TRUE
    ReapRule = "universal"
    CompactionModelled = FALSE
    StableMembership = TRUE
    RetirementDurable = TRUE
    BanEnforced = TRUE

INVARIANT
    NotAllMembersReaped

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
