\* THE MODEL at three replicas. MaxSeq = 1: at MaxSeq = 2 the space exceeds 64M distinct states without closing.
SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2, r3}
    Buckets = {b1, b2}
    MaxSeq = 1
    SkipIsHole = TRUE
    ContigClaim = TRUE
    GateOnRegistration = TRUE
    ServeGate = TRUE
    AdoptIfComplete = TRUE
    GapVerdict = TRUE
    VersionSkew = TRUE
    SkewReplica = r2
    SkewBucket = b2

INVARIANT
    TypeOK
    NoOverClaim
    NoStrandedCell

CHECK_DEADLOCK FALSE
