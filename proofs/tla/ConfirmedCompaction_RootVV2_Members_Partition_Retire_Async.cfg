\* The rule under proof on the applier-backed instance (the durable main
\* database) with the ETS page GC, a cut and a retirement. Expect
\* exhaustive clean.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 1
    Rule = "rootvv"
    AsyncApply = TRUE
    Sweep = "all"
    Witnesses = "members"
    MaxCuts = 1
    MaxRetire = 1
    CapAtUnapplied = TRUE
INVARIANTS TypeOK NoLoss NoGap PrefixClosed
PROPERTIES NoDrop
CHECK_DEADLOCK FALSE
