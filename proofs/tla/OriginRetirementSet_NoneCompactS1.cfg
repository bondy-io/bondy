\* Reap licensed by retirement alone (ReapRule = "none"), with log
\* compaction and stable membership, MaxSeq = 1. Adds NoStuckEvent to the
\* safety invariants. Recorded: NoStuckEvent violated, in README.md,
\* "Which precondition licenses the drop".
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    ReapEnabled = TRUE
    ReapRule = "none"
    CompactionModelled = TRUE
    StableMembership = TRUE
    RetirementDurable = TRUE
    BanEnforced = TRUE

INVARIANTS
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
    RetiredSkipIsSafe
    NoStuckEvent

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
