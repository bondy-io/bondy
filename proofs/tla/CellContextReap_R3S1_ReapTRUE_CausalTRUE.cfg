\* Three replicas with symmetry, reap on, causal delivery, Directory =
\* "projection". Checks all seven invariants. Recorded: clean on all seven
\* (proofs/tla/README.md, "Cell-context reaping" section).
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 1
    ReapEnabled = TRUE
    CausalDelivery = TRUE
    Directory = "projection"

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoResurrection
    Convergence
    NoPhantomDot
    ContextCoversDots
    DirectoryComplete
    DeadContextReachable

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
