\* The rule under proof under a partition. Under "members" a cut only
\* disables Sync (Expire is disabled and Peers reads neither link nor
\* fresh), so every state reachable here is reachable in
\* ConfirmedCompaction_RootVV3.cfg as the same behaviour without those
\* rounds; with fused apply and MaxSeq = 1 every tree key is applied, so
\* the cap that config leaves off never binds. This config confirms that
\* argument. Expect clean.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxSeq = 1
    Skew = 0
    Rule = "rootvv"
    AsyncApply = FALSE
    Sweep = "none"
    Witnesses = "members"
    MaxCuts = 2
    MaxRetire = 0
    CapAtUnapplied = TRUE
INVARIANTS TypeOK NoLoss PrefixClosed
PROPERTIES NoDrop
CHECK_DEADLOCK FALSE
