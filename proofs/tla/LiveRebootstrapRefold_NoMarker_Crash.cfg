\* The re-bootstrap order without the durable "re-fold owed" mark
\* (DurableMarker = FALSE). Two replicas, one fault, one crash.
\* Checks TypeOK, NoStrandedEvent, ClaimSound and Converges.
\* Recorded as failing in "Re-bootstrap ordering",
\* apps/bondy_db/doc_extras/architecture/06_compaction_and_bootstrap.md.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 2
    UnconditionalInstall = TRUE
    RederiveEarly = TRUE
    DurableMarker = FALSE
    ServeGuard = TRUE
    ReplaceFrontier = TRUE
    MaxFaults = 1
    MaxTrailFails = 0
    MaxCrashes = 1
    MaxWriteFails = 0
    WriteFailAborts = TRUE
INVARIANT TypeOK
INVARIANT NoStrandedEvent
INVARIANT ClaimSound
PROPERTY Converges
CHECK_DEADLOCK FALSE
