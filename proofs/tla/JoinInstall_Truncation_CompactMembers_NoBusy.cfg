\* The shipped base without the busy guard: a replica starts installing
\* while it serves an open session.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 1
    MaxEvents = 2
    Reap = FALSE
    MaxInstalls = 2
    InstallMode = "stage"
    MaxCrashes = 0
    RefoldFirst = TRUE
    HlcGuards = {"mark", "serve", "replayed", "target", "early", "token", "trunc", "coverbegin", "floor"}
    CompactBy = "members"
    RetiredExempt = FALSE
INVARIANTS SettledSound SomeoneServes CompactedClaimed NoStrandedRecord
SYMMETRY Sym
CHECK_DEADLOCK FALSE
