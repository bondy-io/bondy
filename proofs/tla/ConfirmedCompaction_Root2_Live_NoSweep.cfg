\* Liveness of the shipped rule WITHOUT page GC (pack backend inside its
\* collection interval), weak fairness. Records whether the stall needs
\* the GC or is intrinsic to the root record.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 0
    Rule = "root"
    AsyncApply = FALSE
    Sweep = "none"
    Witnesses = "members"
    MaxCuts = 0
    MaxRetire = 0
    DoorRule = "drop"
    MaxDepth = 0
    CapAtUnapplied = FALSE
PROPERTIES Convergence
