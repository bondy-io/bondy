\* The fix across restarts, which are not fair here, so this covers arbitrarily many: the pending half is volatile, the checkpoint carries the prefix, the boot re-fold rebuilds the rest.
SPECIFICATION FairSpec

CONSTANTS
    Origins = {o1}
    Buckets = {b1, b2}
    MaxSeq = 3
    Unroutable = b2
    ClaimRule = "Pending"
    InOrderDelivery = FALSE
    WholeBatchOnly = FALSE
    CanHeal = TRUE
    CanRefold = TRUE
    CanRestart = TRUE
    DoorTruncates = TRUE
    TruncatePrefixOnly = TRUE
    DoorUsesPending = FALSE

PROPERTY EventuallyComplete
