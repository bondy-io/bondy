\* Baseline: the frontier is never reaped (today's behaviour). Establishes
\* that the model itself does not manufacture a spurious gap.
SPECIFICATION Spec
CONSTANTS
    Replicas = {r1, r2, r3}
    MaxSeq = 2
    ReapEnabled = FALSE
    MeetGated = FALSE
    SoloOnly = FALSE
INVARIANT
    TypeOK
    NoOverClaim
    NoDataLoss
    SpuriousGap
