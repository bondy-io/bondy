\* The contiguous prefix bound alone (`MuxBucketSkip.tla`'s ContigClaim), no re-fold. Sound and lossless under every interleaving.
SPECIFICATION Spec

CONSTANTS
    Origins = {o1}
    Buckets = {b1, b2}
    MaxSeq = 3
    Unroutable = b2
    ClaimRule = "Contig"
    InOrderDelivery = FALSE
    WholeBatchOnly = FALSE
    CanHeal = TRUE
    CanRefold = FALSE
    CanRestart = FALSE
    DoorTruncates = TRUE
    TruncatePrefixOnly = TRUE
    DoorUsesPending = FALSE

INVARIANTS TypeOK NoOverClaim NoLoss
