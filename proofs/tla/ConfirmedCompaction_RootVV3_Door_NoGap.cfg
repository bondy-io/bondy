\* NoGap with every member reachable and none retired. The watermark door
\* drops an event that arrives after compaction with a key below the
\* watermark, though a member has not received it, so a round against
\* that peer reports a frontier gap. Replayed on fused instances by
\* bondy_oplog_bootstrap_rederive_test:watermark_door_leaves_a_gap/0.
\* Expect NoGap violated.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxSeq = 1
    Skew = 0
    Rule = "rootvv"
    AsyncApply = FALSE
    Sweep = "none"
    Witnesses = "members"
    MaxCuts = 0
    MaxRetire = 0
    CapAtUnapplied = TRUE
INVARIANTS TypeOK NoLoss NoGap PrefixClosed
PROPERTIES NoDrop
CHECK_DEADLOCK FALSE
