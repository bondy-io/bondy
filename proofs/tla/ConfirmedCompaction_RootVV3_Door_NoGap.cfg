\* NoGap with every member reachable and none retired, under a door that
\* drops every applied event at or below the watermark (DoorRule = "drop").
\* It drops an event that arrives after compaction with a key below the
\* watermark, though a member has not received it, so a round against that
\* peer reports a frontier gap. Expect NoGap violated; the confirmed door
\* holds it (Door_Confirmed).
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxSeq = 1
    Skew = 0
    Rule = "rootvv"
    AsyncApply = FALSE
    Sweep = "none"
    Witnesses = "members"
    MaxCuts = 0
    MaxRetire = 0
    DoorRule = "drop"
    MaxDepth = 0
    CapAtUnapplied = TRUE
INVARIANTS TypeOK NoLoss NoGap PrefixClosed
PROPERTIES NoDrop
CHECK_DEADLOCK FALSE
