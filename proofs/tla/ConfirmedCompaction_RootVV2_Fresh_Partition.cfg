\* The shipped witness set at two replicas: a replica whose only peer is
\* stale has no witness, so its peer-confirmed compaction truncates nothing
\* (compute_frontier_for/2 on []). The model's Compact also skips the
\* watermark catch-up the code still runs with no witness (it truncates only
\* applied keys at or below the existing watermark). Expect exhaustive clean.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2}
    MaxSeq = 2
    Skew = 1
    Rule = "rootvv"
    AsyncApply = FALSE
    Sweep = "none"
    Witnesses = "fresh"
    MaxCuts = 1
    MaxRetire = 0
    DoorRule = "drop"
    MaxDepth = 0
    CapAtUnapplied = TRUE
INVARIANTS TypeOK NoLoss NoGap PrefixClosed
PROPERTIES NoDrop
CHECK_DEADLOCK FALSE
