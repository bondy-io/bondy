\* The rule under proof with the operator retiring one member at any
\* point. Cuts are covered by the argument in
\* ConfirmedCompaction_RootVV3_Members_Partition.cfg. Expect exhaustive clean.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxSeq = 1
    Skew = 0
    Rule = "rootvv"
    AsyncApply = FALSE
    Sweep = "none"
    Witnesses = "members"
    MaxCuts = 0
    MaxRetire = 1
    CapAtUnapplied = TRUE
INVARIANTS TypeOK NoLoss PrefixClosed
PROPERTIES NoDrop
CHECK_DEADLOCK FALSE
