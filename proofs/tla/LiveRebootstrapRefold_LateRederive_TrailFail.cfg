\* The re-bootstrap order, but the full re-fold runs only after a successful
\* trailing round (RederiveEarly = FALSE). Two replicas, one fault, one
\* failed trailing round.
\* Checks TypeOK, NoStrandedEvent, ClaimSound and Converges.
\* Recorded as failing in "Re-bootstrap ordering",
\* apps/bondy_db/doc_extras/architecture/06_compaction_and_bootstrap.md.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 2
    UnconditionalInstall = TRUE
    RederiveEarly = FALSE
    DurableMarker = TRUE
    ServeGuard = TRUE
    ReplaceFrontier = TRUE
    MaxFaults = 1
    MaxTrailFails = 1
    MaxCrashes = 0
    MaxWriteFails = 0
    WriteFailAborts = TRUE
INVARIANT TypeOK
INVARIANT NoStrandedEvent
INVARIANT ClaimSound
PROPERTY Converges
CHECK_DEADLOCK FALSE
