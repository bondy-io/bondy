\* Dispatched_Remark, with the barrier clearing intents while a rebuild is due.
SPECIFICATION Spec
CONSTANTS
    Keys = {k1}
    Vals = {"none", "a", "b"}
    MaxEvents = 2
    MaxBatch = 1
    MaxInstalls = 0
    MaxCrashes = 1
    MaxWriterCrashes = 0
    MaxSaturations = 2
    MaxCleanReopens = 0
    MaxIndexEntries = 100
    Intents = TRUE
    IntentInBatch = TRUE
    SyncBeforeClear = TRUE
    ClearBound = "dispatched"
    OrderByVersion = TRUE
    VersionPerEvent = TRUE
    InstallMode = "synced"
    VersionSource = "recorded"
    StampBeforeReplay = TRUE
    MarkNeedsFlush = TRUE
    KeepRequests = TRUE
    CrashKeeps = "prefix"
    IndexCrashKeeps = "prefix"
    RebuildAtOpen = FALSE
    OpenDispatched = "cleared"
    SyncBeforeMark = TRUE
    SyncBeforeWipe = TRUE
    ClearMarked = TRUE
    OpenFlushes = TRUE
    FreshenNeedsFlush = TRUE
    UnmarkMayFail = FALSE
    RebuildUnmarks = TRUE
    SyncBeforeInstall = TRUE
    RebuildWipes = TRUE
    RebuildRefolds = TRUE
INVARIANTS TypeOK IndexMatchesPrimary FreshMeansComplete
CHECK_DEADLOCK FALSE
