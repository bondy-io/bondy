\* The shipped policy: the owner restates on every echo, and an instance restart
\* reopens the DB. Two peers, stamps up to 4. Checks SettledCellIsTruth and
\* SettledStubIsTruth. Recorded: exhaustive clean (proofs/tla/README.md,
\* "`RibAbs.tla`, `RibReading.tla`" section).
CONSTANTS
    Peers = {p1, p2}
    MaxOps = 2
    MaxResets = 2
    MaxStamp = 4
    SelfHealEnabled = TRUE
    ReapEnabled = TRUE
    SweepOnce = TRUE
    HealOnAbsent = FALSE
    HealOnForeignTop = FALSE
    HealAlways = TRUE
    StubFollowsCell = FALSE
    Durable = FALSE
    ReopenEnabled = TRUE
    ClockRegress = FALSE
    RestartEnabled = TRUE
    RestartRestore = FALSE
    RestartReopens = TRUE

SPECIFICATION Spec
INVARIANTS
    TypeOK
    SettledCellIsTruth
    SettledStubIsTruth
CHECK_DEADLOCK FALSE
SYMMETRY PeerSym
