\* The full re-bootstrap order, with one failed install write that fails the
\* batch (WriteFailAborts = TRUE). Two replicas, one fault, one failed
\* trailing round, one crash.
\* Checks TypeOK, NoStrandedEvent, ClaimSound and Converges.
\* No recorded result.
SPECIFICATION FairSpec
CONSTANTS
    Replicas = {r1, r2}
    MaxSeq = 2
    UnconditionalInstall = TRUE
    RederiveEarly = TRUE
    DurableMarker = TRUE
    ServeGuard = TRUE
    ReplaceFrontier = TRUE
    MaxFaults = 1
    MaxTrailFails = 1
    MaxCrashes = 1
    MaxWriteFails = 1
    WriteFailAborts = TRUE
INVARIANT TypeOK
INVARIANT NoStrandedEvent
INVARIANT ClaimSound
PROPERTY Converges
CHECK_DEADLOCK FALSE
