# =============================================================================
# Outbound email — a bondy.conf fragment.
#
# Paste the parts you need into `etc/bondy.conf`. With no `mail.relay.*` key
# configured at all, bondy_mail starts, does nothing, and every mail procedure
# answers `bondy.error.mail_not_configured`. That is the dormant state, not a
# fault: a node that does not send email must still boot.
#
# A relay is operator-owned infrastructure. Its credentials are declared here
# and nowhere else: never in a broker bridge specification, never in an RPC
# argument, and never in a log line or an error payload.
# =============================================================================


# -----------------------------------------------------------------------------
# Development: Mailpit, from examples/mailpit/docker-compose.yml
#
#   make mailpit
#
# Mailpit keeps every message instead of delivering it and shows them at
# http://localhost:8025 - so this relay is safe to point real application
# traffic at while developing.
# -----------------------------------------------------------------------------

mail.relay.local.host = localhost
mail.relay.local.port = 1025
mail.relay.local.transport = plain
mail.relay.local.auth = never
mail.relay.local.from = no-reply@bondy.test

# `*` means every realm. Fine here; see the production relay below for why it
# is not the default.
mail.relay.local.realms = *


# The same Mailpit instance over STARTTLS, verifying the certificate the
# compose stack generated. `cacertfile` points at the certificate AUTHORITY,
# not at Mailpit's own certificate: a self-signed leaf is refused as
# `selfsigned_peer` however trusted it is.
#
# mail.relay.local_tls.host = localhost
# mail.relay.local_tls.port = 1025
# mail.relay.local_tls.transport = starttls
# mail.relay.local_tls.tls.verify = verify_peer
# mail.relay.local_tls.tls.cacertfile = ./examples/mailpit/certs/ca.pem
# mail.relay.local_tls.auth = never
# mail.relay.local_tls.from = no-reply@bondy.test
# mail.relay.local_tls.realms = *


# -----------------------------------------------------------------------------
# Production: a transactional relay, scoped to the realms allowed to use it.
# -----------------------------------------------------------------------------

mail.relay.transactional.host = smtp.example.com
mail.relay.transactional.port = 587

# STARTTLS is the default and is REQUIRED once asked for: if the relay will not
# offer the upgrade the send fails rather than silently continuing in plaintext.
mail.relay.transactional.transport = starttls

# Certificate verification is on by default. Leave `cacertfile` unset to verify
# against the operating system trust store, which is what a public relay is
# signed against.
mail.relay.transactional.tls.verify = verify_peer

mail.relay.transactional.auth = always
mail.relay.transactional.username = apikey

# The credential comes from the environment, not from this file. `aws_sm` reads
# it from AWS Secrets Manager instead; `none` takes a literal `secret.value`
# and warns loudly at boot naming the relay.
mail.relay.transactional.secret.provider = env
mail.relay.transactional.secret.env.var = BONDY_SMTP_PASSWORD

# The default sender. A caller that does not name one gets this, which is why a
# caller cannot spoof by default.
#
# May carry a display name, which is where the brand a recipient sees belongs.
# The name reaches the From header only: the envelope always carries the bare
# address, because MAIL FROM cannot hold anything else.
mail.relay.transactional.from = Acme Ltd <no-reply@example.com>

# Domains a caller may claim in `from`. Unset means callers cannot set it at
# all, which is the safe default: an allow-list you forgot to configure permits
# nothing, whereas validating an asserted sender after the fact permits
# everything.
#
# Matched against the ADDRESS, so a caller asking to send as
# `Trusted Sender <attacker@evil.example>` is checked on evil.example and
# refused. A display name grants nothing.
mail.relay.transactional.allowed_from = example.com, mail.example.com

# Which realms may use this relay. Default-deny: unset means the master realm
# only. A PROTOTYPE URI here admits every realm that inherits from it, so a
# family of tenant realms can be granted access in one line.
mail.relay.transactional.realms = com.acme.app, com.acme.admin

# Concurrency and backpressure. A full queue refuses immediately rather than
# blocking the caller, because a caller that blocks on a stalled relay has moved
# the stall rather than absorbed it.
mail.relay.transactional.pool.size = 4

# The queue is bounded twice, for the relay as a whole: by how many messages may
# wait, and by how much they may hold. The second is the one that decides how
# much memory a relay that has stopped answering can occupy - a bound in
# messages alone says nothing, because a message may be a hundred bytes or
# twenty megabytes.
mail.relay.transactional.queue.max_size = 1000
mail.relay.transactional.queue.max_bytes = 64MB

# How long a message may wait before it is shed unsent. A shed message is
# reported to whoever is waiting and recorded in its status; it does not count
# against the relay's health, because our queue backing up says nothing about
# whether the relay is answering.
mail.relay.transactional.queue.ttl = 5m

mail.relay.transactional.timeout = 30s

# Retries apply to TRANSIENT failures only. A 5xx is permanent and is never
# retried: a rejected recipient is rejected however many times it is offered.
mail.relay.transactional.retry.max_attempts = 3
mail.relay.transactional.retry.backoff.min = 1s
mail.relay.transactional.retry.backoff.max = 1m

# Messages per second, and the burst above it. 0 disables the limit. This
# protects the relay's quota, so refusal happens on the caller's side of the
# queue.
mail.relay.transactional.rate_limit.rate = 20
mail.relay.transactional.rate_limit.burst = 50

mail.relay.transactional.max_message_size = 25MB

# Envelope recipients in one message, counting to, cc and bcc together - they
# all become RCPT TO commands in a single transaction, so a relay sees their
# sum. RFC 5321 obliges a server to accept 100.
mail.relay.transactional.max_recipients = 100

# Consecutive TRANSIENT failures that mark the relay down, raising the
# `mail_relay_down` alarm. Permanent failures do not count: a rejected
# recipient says nothing about the relay being reachable.
mail.relay.transactional.health.failure_threshold = 3

# Consecutive successes that clear the alarm again. Delivery itself recovers on
# the FIRST success regardless; only the alarm waits, so that a relay which
# alternates between working and failing does not alternate the page.
mail.relay.transactional.health.success_threshold = 1


# -----------------------------------------------------------------------------
# Cross-cutting
# -----------------------------------------------------------------------------

# Used when a request does not name a relay. With several relays and no default
# a caller must name one: guessing on their behalf is how mail goes out through
# the wrong relay.
mail.default_relay = transactional

# How long `bondy.mail.status.get` remembers a message, which is also the
# window in which an idempotency key deduplicates.
mail.status.ttl = 1h
mail.status.max_size = 50000


# -----------------------------------------------------------------------------
# The broker bridge (Pub/Sub to email)
#
# Enable it on EVERY node. Each node handles only locally-published events, so
# a node without it silently drops the events published to it. The subscription
# and the message template live in the bridge specification - see
# examples/config/smtp_bridge_config.json.
# -----------------------------------------------------------------------------

# broker_bridge.smtp.enabled = on
# broker_bridge.config_file = ./etc/broker_bridge_config.json
