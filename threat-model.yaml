    caller_obligations_acknowledged: []
    adversary_capabilities_forwarded: []
    outputs_consumed: []
    covered_here: true
    violation_disposition: "OUT-OF-MODEL: dependency-contract"
    provenance: {kind: assumption, question_id: Q1, rationale: "compiled into the release from apps/, so in model"}

build_policy:
  security_relevant_flags_present: true
  provenance: {kind: documented, source: "schema/bondy.schema"}

build_flags:
  - name: "cluster.tls.enabled"
    default: "off"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: peer-plane
        effect: voids
    provenance: {kind: documented, source: "schema/bondy.schema:4319-4323"}
  - name: "cluster.tls.server.verify"
    default: "verify_none"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: peer-plane
        effect: voids
    provenance: {kind: documented, source: "schema/bondy.schema:4366-4370"}
  - name: "cluster.tls.client.verify"
    default: "verify_none"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: peer-plane
        effect: voids
    provenance: {kind: documented, source: "schema/bondy.schema:4401-4404"}
  - name: "cluster.tls.allow_insecure"
    default: "off"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: cluster-insecure-refusal
        effect: voids
    provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - name: "security.allow_anonymous_user"
    default: "local"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: safe-defaults
        effect: voids
    provenance: {kind: documented, source: "schema/bondy.schema:1195-1207"}
  - name: "security.admin_user.password"
    default: "unset"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: safe-defaults
        effect: preserves
    provenance: {kind: documented, source: "schema/bondy.schema:1208-1215"}
  - name: "security.password.pbkdf2.iterations"
    default: "600000"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: password-kdf
        effect: narrows
    provenance: {kind: documented, source: "schema/bondy.schema:1492-1503"}
  - name: "security.master_key"
    default: "unset"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: keyring-fail-closed
        effect: narrows
      - property_id: at-rest-aead
        effect: narrows
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_keyring.erl moduledoc"}
  - name: "listeners.$name.proxy_protocol"
    default: "off"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: proxy-trust-bounded
        effect: preserves
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_http_proxy_protocol.erl:80-95"}
  - name: "listeners.$name.proxy_protocol.trusted_proxies"
    default: "unset"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: proxy-trust-bounded
        effect: preserves
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_http_proxy_protocol.erl:266-272"}
  - name: "mcp.manifest.mode"
    default: "curated"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: mcp-indistinguishable
        effect: preserves
    provenance: {kind: documented, source: "schema/bondy_mcp.schema:30-33"}
  - name: "serialization.erl.decode"
    default: "[]"
    security_relevant: false
    maintainer_stance: supported
    affects_properties: []
    provenance: {kind: documented, source: "apps/bondy_wamp/src/bondy_wamp_encoding.erl:581-585"}
  - name: "cryptosign.exec"
    default: "unset"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - property_id: issuer-trust
        effect: preserves
    provenance: {kind: documented, source: "apps/bondy_wamp/src/bondy_wamp_cryptosign.erl:302-313"}
  - name: "realm.security_enabled"
    default: "on"
    security_relevant: true
    maintainer_stance: dev-only
    affects_properties:
      - property_id: authz-default-deny
        effect: voids
      - property_id: safe-defaults
        effect: voids
    provenance: {kind: assumption, question_id: Q6}

properties_claimed:
  - id: wire-atom-safety
    kind: integrity
    components: [f2-transports, f3-serialization]
    tier: security-critical
    conditions: "any serializer reachable from an untrusted connection; wire path only, not own persisted bytes"
    violation_symptoms: [crash]
    provenance: {kind: documented, source: "apps/bondy_wamp/src/bondy_wamp_encoding.erl:573-585"}
  - id: authz-default-deny
    kind: authentication
    components: [f5-authorization]
    tier: security-critical
    conditions: "sessions in a realm with security_enabled true"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_rbac.erl:866-870"}
  - id: gateway-fail-closed
    kind: authentication
    components: [f6-http-gateway]
    tier: security-critical
    conditions: "only an explicitly empty security map is served anonymously"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_http_gateway_rest_handler.erl:439-468"}
  - id: jwt-alg-pinned
    kind: integrity
    components: [f4-authentication]
    tier: security-critical
    conditions: "verify_strict against a static asymmetric-only allow-list"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "?ALLOWED_JWT_ALGS in apps/bondy_router/include/bondy_security.hrl"}
  - id: password-kdf
    kind: confidentiality
    components: [f4-authentication]
    tier: security-critical
    conditions: "default 600000 iterations; the translation accepts 4096 to 10000000"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "schema/bondy.schema:1492-1503"}
  - id: keyring-fail-closed
    kind: confidentiality
    components: [f8-storage-at-rest]
    tier: security-critical
    conditions: "master_key configured but unresolvable fails closed rather than writing plaintext"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_keyring.erl moduledoc"}
  - id: at-rest-aead
    kind: integrity
    components: [f8-storage-at-rest]
    tier: security-critical
    conditions: "at-rest encryption enabled; seal and open variants bind realm URI and kid as AAD"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_keyring.erl moduledoc Envelope format"}
  - id: own-bytes-rule
    kind: integrity
    components: [f8-storage-at-rest]
    tier: security-critical
    conditions: "own persisted bytes decode plain; peer-shipped bytes decode with [safe]"
    violation_symptoms: [crash]
    provenance: {kind: documented, source: "apps/bondy_oplog/src/bondy_oplog_compaction_checkpoint_file.erl:170-176"}
  - id: generic-auth-failure
    kind: confidentiality
    components: [f4-authentication]
    tier: security-critical
    conditions: "covers the returned ABORT reason only, not timing"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "bondy_wamp_protocol:abort_message/1 genericization"}
  - id: session-id-entropy
    kind: authentication
    components: [f1-session-protocol, f2-transports, f4-authentication]
    tier: security-critical
    conditions: "the full session id only; the 56-bit external id is a public protocol identifier, not a secret"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_session_id.erl:51-75"}
  - id: identity-authoritative
    kind: integrity
    components: [f1-session-protocol]
    tier: security-critical
    conditions: "caller identity is taken from the router session context, never from the client message"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_dealer.erl:2551-2558"}
  - id: mcp-indistinguishable
    kind: confidentiality
    components: [f9-egress-connectors]
    tier: security-critical
    conditions: "hidden and absent manifest entries answer identically; the denial audit record is off-wire"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc"}
  - id: mcp-state-sealed
    kind: integrity
    components: [f9-egress-connectors]
    tier: security-critical
    conditions: "requestState is sealed and client _mcp-namespace kwargs are refused"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc s11.1"}
  - id: mcp-stateless
    kind: confidentiality
    components: [f9-egress-connectors]
    tier: security-critical
    conditions: "the modern per-request edge only; the handshake era keeps session state"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc s5.2"}
  - id: cluster-insecure-refusal
    kind: availability
    components: [f7-cluster-replication]
    tier: security-critical
    conditions: "fires only when cluster.peer_discovery.enabled is on"
    violation_symptoms: [bad-data-accepted]
    provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - id: proxy-trust-bounded
    kind: authentication
    components: [f2-transports, f6-http-gateway]
    tier: security-critical
    conditions: "forwarding headers move source_ip only from a peer inside a configured trusted_proxies CIDR; with the list unset no peer is trusted"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_http_proxy_protocol.erl:80-95"}
  - id: auth-rate-limited
    kind: availability
    components: [f4-authentication]
    tier: security-critical
    conditions: "the auth class limiter is consulted before the credential is checked; this claims consultation, not that it always answers"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_wamp_protocol.erl:467-472"}
  - id: safe-defaults
    kind: authentication
    components: [f4-authentication, f5-authorization, f10-admin-control-plane]
    tier: security-critical
    conditions: "the default configuration of a fresh install only; not a deployment the operator has opened up"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "schema/bondy.schema:1195-1215"}

  - id: realm-isolation
    kind: authentication
    components: [f5-authorization]
    tier: security-critical
    conditions: "exact matches an identical URI only; prefix matches on a component boundary; wildcard is component-wise with equal component count. The EMPTY prefix matches every URI by design."
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_wamp/src/bondy_wamp_uri.erl:79-113, pinned by bondy_wamp_uri_SUITE:237-273 and bondy_rbac_SUITE:893-898"}
  - id: issuer-trust
    kind: authentication
    components: [f4-authentication]
    tier: security-critical
    conditions: "a ticket authrealm is accepted only when it equals the target realm or that realm's configured SSO realm"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_realm.erl:1085-1091"}
  - id: control-plane-boundary
    kind: authentication
    components: [f10-admin-control-plane]
    tier: security-critical
    conditions: "admin-only procedures require a master-realm session; other meta-API calls bind the realm argument to the session realm unless the session is on the master realm"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_wamp_api_utils.erl:151-190"}
  - id: admin-socket-perms
    kind: confidentiality
    components: [f10-admin-control-plane]
    tier: security-critical
    conditions: "the admin_local socket only; mode 0600 in a 0700 directory, and the listener refuses to start if the mode cannot be set. Other UDS listeners are NOT narrowed."
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_listener_ranch.erl:425-445"}
  - id: revocation-invalidation
    kind: integrity
    components: [f5-authorization]
    tier: security-critical
    conditions: "node-local: every grant and revoke invalidates this node's cached contexts and the session re-resolves on its next authorization. The 300s epoch is a backstop. The cross-node window is disclaimed separately."
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_rbac.erl:72 and :1179-1180"}

  - id: complexity-bound
    kind: resource-bound
    components: [f1-session-protocol, f3-serialization, f6-http-gateway]
    tier: security-critical
    conditions: "THRESHOLD: super-linear work in message size, subscription count, registry size or session count on a routing/registry/decode path is a bug; a constant factor is not. Does not cover AAE work under divergence, absolute traffic volume, or work caused in a downstream system."
    violation_symptoms: [hang, unbounded-allocation]
    provenance: {kind: maintainer, date: "2026-08"}
  - id: mail-header-integrity
    kind: output-sanitization
    components: [f9-egress-connectors]
    tier: security-critical
    conditions: "header NAMES and VALUES on the mail path only; not message bodies and not the other connectors. CR/LF/NUL are REJECTED, never stripped or folded. Routing and identity headers are set from the request and relay config; caller copies are refused."
    violation_symptoms: [bad-data-accepted]
    provenance: {kind: maintainer, date: "2026-08"}
  - id: token-lifetime
    kind: authentication
    components: [f4-authentication]
    tier: security-critical
    conditions: "Bondy-issued credentials only. JWT: rejected once iat + exp + 120s has passed, where exp is a DURATION not an RFC 7519 NumericDate, and the leeway EXTENDS validity. Ticket: rejected once expires_at is within 120s of now, where the leeway SHORTENS validity. No nbf is issued or checked."
    violation_symptoms: [bad-data-accepted]
    provenance: {kind: maintainer, date: "2026-08"}
  - id: constant-time-compare
    kind: confidentiality
    components: [f4-authentication]
    tier: security-critical
    conditions: "covers every credential comparison. CRA and SCRAM call compare/2; stored passwords use crypto:hash_equals/2 directly; cryptosign and tokens delegate to Ed25519 and jose verify_strict. compare/2 answers false on unequal lengths rather than raising. Fixed 2026-08-30 - both CRA and SCRAM previously hand-compared."
    violation_symptoms: [info-leak]
    provenance: {kind: maintainer, date: "2026-08"}
  - id: convergence
    kind: integrity
    components: [f7-cluster-replication]
    tier: security-critical
    conditions: "GIVEN HONEST REPLICAS. Merge is commutative, idempotent under redelivery, and convergent for the supported cell types. Does not cover the reclamation-versus-in-flight-read interaction (Q17), nor a Byzantine participant."
    violation_symptoms: [integrity-bypass]
    provenance: {kind: maintainer, date: "2026-08"}
  - id: session-teardown
    kind: integrity
    components: [f1-session-protocol]
    tier: security-critical
    conditions: "registrations and subscriptions keyed by the ref session id; registrations are removed BEFORE promises are flushed so a concurrent CALL cannot pick a departing callee. Cluster broadcast is suppressed; other nodes learn by replication."
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_dealer.erl:366-376 and bondy_broker.erl:150-160"}
  - id: hlc-monotonic
    kind: correctness
    components: [f7-cluster-replication]
    tier: correctness-only
    conditions: "PER-REPLICA only. Strictly increasing 64-bit value that never regresses across backwards system-clock jumps, repeated same-millisecond calls, or peer events from clocks ahead. Logical overflow clamps and advances physical rather than wrapping. Says nothing about agreement BETWEEN replicas - see clock-skew."
    violation_symptoms: [wrong-output]
    provenance: {kind: maintainer, date: "2026-08"}
  - id: no-partial-session
    kind: authentication
    components: [f1-session-protocol, f2-transports, f3-serialization]
    tier: security-critical
    conditions: "a session is created only on the success branch; the error clause never reaches bondy_session_manager:open/3. Out-of-order messages stop the connection rather than mutating state."
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_wamp_protocol.erl:547-569 and :617"}
  - id: mops-bounded
    kind: integrity
    components: [f6-http-gateway]
    tier: security-critical
    conditions: "mops is the umbrella app apps/mops as of 2026-08-30, no longer an external git dep tracked on {branch, master}. Verified: 34 apply_op clauses, no erlang:apply / list_to_atom / binary_to_atom, one binary_to_existing_atom that cannot mint atoms, unknown operators raise invalid_expression."
    violation_symptoms: [integrity-bypass]
    provenance: {kind: maintainer, date: "2026-08"}
  - id: reclaim-safe-read
    kind: correctness
    components: [f7-cluster-replication, f8-storage-at-rest]
    tier: correctness-only
    conditions: "reclamation runs inside the applier, the sole writer, so a discard cannot interleave with an apply to the same cell; the overlay fence discards a cell only when nothing is pending for its key. The strict boundary keeps a tombstone whose HLC equals the stability point."
    violation_symptoms: [wrong-output]
    provenance: {kind: documented, source: "doc/guides/database/deletion_and_reclamation.md, The sweep"}
  - id: session-confinement
    kind: confidentiality
    components: [f1-session-protocol, f2-transports, f4-authentication, f5-authorization, f6-http-gateway]
    tier: security-critical
    conditions: "per-session state is process-local. Bondy is NOT share-nothing: the projection (single writer), the HLC (atomics + compare_exchange), the registry (ETS) and the rate-limit buckets (ETS) are deliberately shared and are OUTSIDE this property. A race inside one of those is a real finding."
    violation_symptoms: [data-race, info-leak]
    provenance: {kind: maintainer, date: "2026-08"}
properties_disclaimed:
  - id: peer-plane
    components: [f7-cluster-replication]
    conditions: "Partisan node-to-node traffic only; not client listeners and not the cryptosign-authenticated bridge relay. Rests on a STATED limit."
    tier: security-critical
    false_friend: false
    provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - id: byzantine-tolerance
    components: [f7-cluster-replication]
    conditions: "no quorum or voting; a single rogue peer with peer-plane access can inject security state"
    tier: security-critical
    false_friend: false
    provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - id: at-rest-plaintext
    components: [f8-storage-at-rest]
    conditions: "covers only the claim that the shipped DEFAULT is plaintext; plaintext despite master_key being set, or absence of any mechanism, routes VALID via keyring-fail-closed. Rests on a STATED limit."
    tier: security-critical
    false_friend: false
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_keyring.erl moduledoc"}
  - id: rate-limit-failopen
    components: [f1-session-protocol, f2-transports, f4-authentication, f6-http-gateway]
    conditions: "the node, listener, and realm scopes of bondy_rate_limit; does not cover the frame-size caps, which are hard limits. Rests on a STATED limit."
    tier: security-critical
    false_friend: true
    provenance: {kind: documented, source: "_plans/2026-08-29-rate-limit-scopes-design.md Fail-open at every scope"}
  - id: rate-limit-not-authz
    components: [f1-session-protocol, f4-authentication, f6-http-gateway]
    conditions: "all rate-limit classes; a refusal is a transient signal, never a permission verdict"
    tier: correctness-only
    false_friend: true
    provenance: {kind: documented, source: "_plans/2026-08-29-rate-limit-scopes-design.md R2"}
  - id: realm-quota-per-node
    components: [f1-session-protocol, f5-authorization]
    conditions: "the realm total budget kind in v1; buckets are node-local"
    tier: correctness-only
    false_friend: true
    provenance: {kind: documented, source: "_plans/2026-08-29-rate-limit-scopes-design.md R4"}
  - id: audit-failopen
    components: [f9-egress-connectors]
    conditions: "bondy_mcp_audit:record/2 only"
    tier: correctness-only
    false_friend: true
    provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_audit.erl:43-45"}
  - id: trust-levels
    components: [f1-session-protocol]
    conditions: "INVOCATION.Details and EVENT.Details trust_level fields"
    tier: correctness-only
    false_friend: true
    provenance: {kind: documented, source: "README.md Call Trust Levels WIP always 0"}
  - id: payload-inspection
    components: [f1-session-protocol, f9-egress-connectors]
    conditions: "all routed call arguments and event payloads, including Payload Passthru Mode which the router cannot read"
    tier: correctness-only
    false_friend: true
    provenance: {kind: documented, source: "README.md Payload Passthru Mode"}
  - id: gateway-egress
    components: [f6-http-gateway]
    conditions: "the forward action; the target comes from the operator spec, not the request, unless a spec templates request data into it"
    tier: security-critical
    false_friend: false
    provenance: {kind: inferred, question_id: Q9}
  - id: egress-taint
    components: [f9-egress-connectors]
    conditions: "Kafka, AWS SNS, Mailgun, SendGrid, SMTP, and HTTP connector payloads"
    tier: security-critical
    false_friend: false
    provenance: {kind: assumption, question_id: Q18}
  - id: dos-beyond-limits
    components: [f1-session-protocol, f3-serialization, f6-http-gateway, f7-cluster-replication, f2-transports, f5-authorization, f8-storage-at-rest, f10-admin-control-plane]
    conditions: "does not cover the frame caps or the KDF cost, which are stated limits"
    tier: security-critical
    false_friend: false
    provenance: {kind: assumption, question_id: Q12}
  - id: client-mtls-request-only
    components: [f2-transports, f6-http-gateway]
    conditions: "covers listeners.$name.tls.verify; requiring a certificate needs fail_if_no_peer_cert on as well. Distinct from the cluster peer plane. Rests on a STATED limit."
    tier: security-critical
    false_friend: true
    provenance: {kind: documented, source: "schema/bondy.schema:3024-3040"}
  - id: clock-skew
    components: [f7-cluster-replication]
    conditions: "no bound on skew BETWEEN replicas and no rejection of a far-future peer timestamp. A far-future stamp wins last-writer-wins indefinitely, so on a security cell a later honest write cannot overwrite it. Reaching that needs peer-plane access, already excluded by the adversary model. Per-replica monotonicity is claimed as hlc-monotonic. Rests on a STATED limit."
    tier: security-critical
    false_friend: false
    provenance: {kind: maintainer, date: "2026-08"}
  - id: token-nbf
    components: [f4-authentication]
    conditions: "issued JWTs and tickets; Bondy neither issues nor checks nbf, so a token is usable from the moment it is signed. Rests on a STATED limit."
    tier: correctness-only
    false_friend: false
    provenance: {kind: maintainer, date: "2026-08"}
  - id: delivery-durability
    components: [f1-session-protocol]
    conditions: "covers pub/sub delivery; Event Retention (a retained last value per topic) is a different feature that does exist"
    tier: correctness-only
    false_friend: true
    provenance: {kind: documented, source: "README.md Advanced Pub/Sub feature list, Event History and Testament unchecked"}
  - id: revocation-immediacy
    components: [f5-authorization]
    conditions: "covers ONLY the cross-node window: another node honours the old grant until replication reaches it, bounded by the 300s context epoch. Invalidation on the writing node is immediate and is claimed as revocation-invalidation. A revocation unhonoured on the writing node, or still honoured after the epoch, routes VALID. Rests on a STATED limit."
    tier: security-critical
    false_friend: false
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_rbac.erl:72 and :151"}

downstream_responsibilities:
  - id: isolate-peer-plane
    component: f7-cluster-replication
    statement: "bind the peer port to a private interface, or enable cluster TLS with verify_peer and a private cluster CA; TLS without verify_peer does not discharge this"
    enforces: [isolate-peer-plane, peer-plane]
    provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - id: set-admin-password-before-first-boot
    component: f10-admin-control-plane
    statement: "set security.admin_user.password before first boot, and the same value on every node of a cluster"
    enforces: [safe-defaults]
    provenance: {kind: documented, source: "schema/bondy.schema:1208-1215"}
  - id: keep-anonymous-loopback-only
    component: f4-authentication
    statement: "leave security.allow_anonymous_user at local unless anonymous access from the network is intended"
    enforces: [safe-defaults]
    provenance: {kind: documented, source: "schema/bondy.schema:1195-1207"}
  - id: keep-realm-security-enabled
    component: f5-authorization
    statement: "never run a production realm with security_enabled false; it disables authentication and RBAC for that realm"
    enforces: [authz-default-deny]
    provenance: {kind: assumption, question_id: Q6, rationale: "the README quick-start disables it for local exploration"}
  - id: bound-proxy-trust
    component: f2-transports
    statement: "when proxy_protocol is enabled set trusted_proxies to the balancer CIDRs, so per-source attribution and IP-scoped credential sources remain meaningful"
    enforces: [proxy-trust-bounded]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_http_proxy_protocol.erl:80-95"}
  - id: require-client-certificate
    component: f2-transports
    statement: "if client mTLS is relied on, set fail_if_no_peer_cert on; verify_peer alone only requests a certificate"
    enforces: [client-mtls-request-only]
    provenance: {kind: documented, source: "schema/bondy.schema:3024-3040"}
  - id: do-not-treat-pubsub-as-durable-queue
    component: f1-session-protocol
    statement: "a subscriber that was disconnected does not receive what it missed; use a broker bridge or an application store for durability"
    enforces: [delivery-durability]
    provenance: {kind: documented, source: "README.md Advanced Pub/Sub feature list"}
  - id: configure-master-key
    component: f8-storage-at-rest
    statement: "configure security.master_key if realm signing keys must be encrypted at rest"
    enforces: [at-rest-plaintext, at-rest-aead]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_keyring.erl moduledoc"}
  - id: do-not-rely-on-rate-limit-for-availability
    component: f1-session-protocol
    statement: "put a hard limiter in front of Bondy if a real request ceiling is required; the built-in limiter fails open"
    enforces: [rate-limit-failopen]
    provenance: {kind: documented, source: "_plans/2026-08-29-rate-limit-scopes-design.md Fail-open at every scope"}
  - id: size-realm-quota-per-node
    component: f5-authorization
    statement: "multiply a realm total budget by node count to get the cluster-wide ceiling"
    enforces: [realm-quota-per-node]
    provenance: {kind: documented, source: "_plans/2026-08-29-rate-limit-scopes-design.md R4"}
  - id: validate-callee-arguments
    component: f1-session-protocol
    statement: "validate call arguments in the callee; Bondy does not inspect payloads"
    enforces: [payload-inspection]
    provenance: {kind: documented, source: "threat-model.md s1.3 non-goal"}
  - id: escape-routed-payloads
    component: f1-session-protocol
    statement: "escape routed payloads for the consuming sink before rendering, logging, or querying"
    enforces: [output-is-sink-safe]
    provenance: {kind: documented, source: "threat-model.md s1.8 taint row"}
  - id: control-spec-authorship
    component: f6-http-gateway
    statement: "treat API-specification authorship as control-plane authority; a spec author chooses each endpoint's security scheme and any forward target"
    enforces: [gateway-egress]
    provenance: {kind: inferred, question_id: Q9}
  - id: cap-frame-size
    component: f2-transports
    statement: "the transport enforces a frame or length cap; a deployment needing a smaller bound sets it at the listener"
    enforces: [dos-beyond-limits]
    provenance: {kind: assumption, question_id: Q8, rationale: "caps observed on the WS and RawSocket paths but not enumerated exhaustively"}
  - id: name-existing-realm
    component: f4-authentication
    statement: "clients must name an existing realm in HELLO"
    enforces: [authz-default-deny]
    provenance: {kind: inferred, question_id: Q8}
  - id: declare-nonstandard-options
    component: f1-session-protocol
    statement: "non-standard WAMP options are underscore-prefixed and declared"
    enforces: [payload-inspection]
    provenance: {kind: assumption, question_id: Q8, rationale: "project convention observed in the routing code"}
  - id: restrict-admin-surface
    component: f10-admin-control-plane
    statement: "restrict the admin listener and the admin unix socket to trusted operators"
    enforces: [safe-defaults]
    provenance: {kind: inferred, question_id: Q19}

known_misuses:
  - id: readme-quickstart-into-production
    components: [f5-authorization]
    pattern: "following the README quick-start's DELETE /realms/{uri}/security_enabled step on a realm that then carries real traffic"
    safer_alternative: "create users, groups, and grants and leave security enabled; treat the quick-start realm as disposable"
    provenance: {kind: documented, source: "README.md Disable Security section; apps/bondy_router/src/bondy_rbac.erl:274"}
  - id: expose-peer-plane-across-networks
    components: [f7-cluster-replication]
    pattern: "binding the Partisan peer port to 0.0.0.0 or routing it over a shared network to join distant nodes"
    safer_alternative: "use a bridge relay, which is cryptosign-authenticated and per-realm, and keep the peer plane on one private network"
    provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - id: proxy-protocol-without-trusted-proxies
    components: [f2-transports, f6-http-gateway]
    pattern: "enabling proxy_protocol while leaving trusted_proxies empty, collapsing every request onto the balancer's address"
    safer_alternative: "set trusted_proxies to the balancer CIDRs, and mode strict if requests without proxy information should be dropped"
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_http_proxy_protocol.erl:80-95"}
  - id: realm-total-read-as-cluster-quota
    components: [f5-authorization]
    pattern: "setting a realm total rate limit expecting it to bound the whole cluster"
    safer_alternative: "divide the intended cluster ceiling by node count, and enforce hard ceilings upstream"
    provenance: {kind: documented, source: "_plans/2026-08-29-rate-limit-scopes-design.md R4"}
  - id: treat-429-as-authorization
    components: [f1-session-protocol, f6-http-gateway]
    pattern: "branching or alerting on rate-limit refusals as though they were permission denials"
    safer_alternative: "branch on the WAMP not_authorized error for permission; treat 429 as transient backpressure"
    provenance: {kind: documented, source: "_plans/2026-08-29-rate-limit-scopes-design.md R2"}
  - id: prototype-realm-across-trust-domains
    components: [f5-authorization]
    pattern: "one prototype realm supplying groups and grants to realms belonging to different tenants"
    safer_alternative: "keep a prototype realm within a single trust domain"
    provenance: {kind: inferred, question_id: Q29}
  - id: client-mtls-without-fail-if-no-peer-cert
    components: [f2-transports, f6-http-gateway]
    pattern: "setting tls.verify to verify_peer on a client listener and leaving fail_if_no_peer_cert off, believing client certificates are required"
    safer_alternative: "set fail_if_no_peer_cert on alongside verify_peer, and confirm a certificate-less client is refused"
    provenance: {kind: documented, source: "schema/bondy.schema:3024-3040"}
  - id: forward-target-templated-from-request
    components: [f6-http-gateway]
    pattern: "an API specification whose forward action builds its target URL from request-supplied values"
    safer_alternative: "keep forward targets static in the specification"
    provenance: {kind: inferred, question_id: Q9}

known_non_findings:
  - id: own-bytes-plain-decode
    components: [f8-storage-at-rest]
    symptom: unsafe-deserialization-atom-exhaustion
    tool_pattern: "binary_to_term/1 called without [safe] in bondy_oplog_crdt_* decode_state/1 or the compaction checkpoint decode/1"
    conditions: "the sink is a decode_state/1 or checkpoint decode/1 in those modules; the bytes decoded were written by this node; and the report does not demonstrate a path by which peer-shipped or client-shipped bytes reach that call. If that last condition fails it is a real finding and routes VALID."
    discharged_by: [own-bytes-rule]
    provenance: {kind: documented, source: "apps/bondy_oplog/src/bondy_oplog_compaction_checkpoint_file.erl:170-176"}
  - id: session-id-non-crypto-prng
    components: [f1-session-protocol]
    symptom: weak-prng-predictable-identifier
    tool_pattern: "rand:uniform/1 used to generate a session identifier at bondy_session_id.erl:54"
    conditions: "the sink is bondy_session_id:new/0 at line 54; the claim is that the FULL session id is guessable; and the report does not identify a mechanism treating the 56-bit external id alone as a secret or capability. If that last condition fails it is a real finding, because the external id is public by construction."
    discharged_by: [session-id-entropy]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_session_id.erl:51-75"}

