    provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc s5.2"}
  - component: f9-egress-connectors
    dimension: resource-complexity
    status: disclaimed
    conditions: "MCP audit emission is fail-open; a failure to record does not refuse service"
    property_id: audit-failopen
    provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_audit.erl:43-45"}
  - component: f10-admin-control-plane
    dimension: numeric-domain
    status: not-applicable
    conditions: "the admin surface exposes no caller-driven numeric domain"
    provenance: {kind: documented, source: "threat-model.md s1.7 contract-dimension matrix"}
  - component: f10-admin-control-plane
    dimension: failure-atomicity
    status: claimed
    conditions: "admin-only procedures require a master-realm session; other meta-API calls bind the realm argument to the session realm"
    property_id: control-plane-boundary
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_wamp_api_utils.erl:151-190"}
  - component: f10-admin-control-plane
    dimension: recursive-cyclic-topology
    status: not-applicable
    conditions: "admin operations are flat commands"
    provenance: {kind: documented, source: "threat-model.md s1.7 contract-dimension matrix"}
  - component: f10-admin-control-plane
    dimension: callback-execution
    status: not-applicable
    conditions: "no operator-supplied code executes in-process"
    provenance: {kind: documented, source: "threat-model.md s1.7 contract-dimension matrix"}
  - component: f10-admin-control-plane
    dimension: serialization-reconstruction
    status: not-applicable
    conditions: "the admin surface deserializes only operator-supplied configuration"
    provenance: {kind: documented, source: "threat-model.md s1.7 contract-dimension matrix"}
  - component: f10-admin-control-plane
    dimension: reference-lifecycle
    status: claimed
    conditions: "the admin_local socket is mode 0600 in a 0700 directory; other UDS listeners are not narrowed"
    property_id: admin-socket-perms
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_listener_ranch.erl:425-445"}
  - component: f10-admin-control-plane
    dimension: concurrency-reentrancy
    status: claimed
    conditions: "the socket mode is the only access control a Unix domain listener has; the listener refuses to start if it cannot be set"
    property_id: admin-socket-perms
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_listener_ranch.erl:425-445"}
  - component: f10-admin-control-plane
    dimension: resource-complexity
    status: disclaimed
    conditions: "no bound on the work an admin operation may cause"
    property_id: dos-beyond-limits
    provenance: {kind: assumption, question_id: Q12}

entry_points:
  - id: wamp-ws-handshake
    component: f2-transports
    parameters:
      - name: subprotocol-header
        attacker_controllable: true
        control_kinds: [type-class]
        caller_must_enforce: "none - wire-atom-safety"
        provenance: {kind: documented, source: "apps/bondy_wamp/src/bondy_wamp_subprotocol.erl:31-32"}
      - name: frame-bytes
        attacker_controllable: true
        control_kinds: [data, size]
        obligation_id: cap-frame-size
        caller_must_enforce: "the transport enforces a frame, length, or body size cap before the payload is decoded"
        provenance: {kind: assumption, question_id: Q8}
  - id: wamp-rawsocket-handshake
    component: f2-transports
    parameters:
      - name: magic-and-serializer-id
        attacker_controllable: true
        control_kinds: [type-class]
        caller_must_enforce: "none - wire-atom-safety"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_wamp_tcp_connection_handler.erl:713-714"}
      - name: maxlength-negotiation
        attacker_controllable: true
        control_kinds: [size]
        obligation_id: cap-frame-size
        caller_must_enforce: "the transport enforces a frame, length, or body size cap before the payload is decoded"
        provenance: {kind: assumption, question_id: Q8}
  - id: wamp-longpoll-sse
    component: f2-transports
    parameters:
      - name: request-body
        attacker_controllable: true
        control_kinds: [data, size]
        obligation_id: cap-frame-size
        caller_must_enforce: "the transport enforces a frame, length, or body size cap before the payload is decoded"
        provenance: {kind: inferred, question_id: Q8}
      - name: session-token
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none - session-id-entropy"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_session_id.erl:51-75"}
  - id: wamp-decode-message
    component: f3-serialization
    parameters:
      - name: wire-bytes-json-msgpack-cbor
        attacker_controllable: true
        control_kinds: [data, serialized-state]
        caller_must_enforce: "none - wire-atom-safety"
        provenance: {kind: documented, source: "apps/bondy_wamp/src/bondy_wamp_encoding.erl:573-585"}
      - name: wire-bytes-erl
        attacker_controllable: true
        control_kinds: [serialized-state]
        caller_must_enforce: "none - wire-atom-safety"
        provenance: {kind: documented, source: "apps/bondy_wamp/src/bondy_wamp_encoding.erl:584"}
  - id: wamp-hello
    component: f4-authentication
    parameters:
      - name: realm-uri
        attacker_controllable: true
        control_kinds: [resource-name]
        obligation_id: name-existing-realm
        caller_must_enforce: "request an existing realm"
        provenance: {kind: inferred, question_id: Q8}
      - name: authid-authmethods-authextra
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none - generic-auth-failure"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_auth.erl"}
  - id: wamp-authenticate
    component: f4-authentication
    parameters:
      - name: signature-or-credential
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none - auth-rate-limited"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_wamp_protocol.erl:467-472"}
  - id: connection-source-ip
    component: f2-transports
    parameters:
      - name: peer-address
        attacker_controllable: false
        control_kinds: [x-network-identity]
        obligation_id: bound-proxy-trust
        caller_must_enforce: "set trusted_proxies to the balancer CIDRs so per-source attribution is correct"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_http_proxy_protocol.erl:80-95"}
  - id: wamp-call-publish
    component: f1-session-protocol
    parameters:
      - name: procedure-or-topic-uri
        attacker_controllable: true
        control_kinds: [resource-name]
        caller_must_enforce: "none - authz-default-deny"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_rbac.erl:866-870"}
      - name: arguments-and-kwargs
        attacker_controllable: true
        control_kinds: [data]
        obligation_id: validate-callee-arguments
        caller_must_enforce: "the callee validates its own arguments; Bondy does not inspect payloads"
        provenance: {kind: documented, source: "threat-model.md s1.3 non-goal"}
      - name: options-map
        attacker_controllable: true
        control_kinds: [data]
        obligation_id: declare-nonstandard-options
        caller_must_enforce: "non-standard options are underscore-prefixed and declared"
        provenance: {kind: assumption, question_id: Q8}
  - id: wamp-register-subscribe
    component: f1-session-protocol
    parameters:
      - name: uri-and-match-policy
        attacker_controllable: true
        control_kinds: [object-topology, resource-name]
        caller_must_enforce: "none - authz-default-deny"
        provenance: {kind: inferred, question_id: Q8}
  - id: http-gateway-route
    component: f6-http-gateway
    parameters:
      - name: path-query-headers-body
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none - gateway-fail-closed"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_http_gateway_rest_handler.erl:439-468"}
      - name: api-specification
        attacker_controllable: false
        control_kinds: [x-policy-document]
        obligation_id: control-spec-authorship
        caller_must_enforce: "the operator controls who may publish API specifications and what forward targets they name"
        provenance: {kind: inferred, question_id: Q9}
  - id: oauth2-oidc-endpoint
    component: f4-authentication
    parameters:
      - name: token-code-state
        attacker_controllable: true
        control_kinds: [data, serialized-state]
        caller_must_enforce: "none - jwt-alg-pinned"
        provenance: {kind: documented, source: "?ALLOWED_JWT_ALGS in apps/bondy_router/include/bondy_security.hrl"}
  - id: mcp-jsonrpc-endpoint
    component: f9-egress-connectors
    parameters:
      - name: authorization-header
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none - generic-auth-failure"
        provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc s6"}
      - name: mcp-protocol-headers
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none - the handler refuses a header that disagrees with the body"
        provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc s10.1"}
      - name: mcp-namespace-kwargs
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none - mcp-state-sealed"
        provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc s11.1"}
  - id: partisan-peer-message
    component: f7-cluster-replication
    parameters:
      - name: replicated-crdt-bytes
        attacker_controllable: true
        control_kinds: [serialized-state]
        obligation_id: isolate-peer-plane
        caller_must_enforce: "isolate the peer network, or enable TLS with verify_peer and a private CA"
        provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - id: bridge-relay-link
    component: f7-cluster-replication
    parameters:
      - name: cryptosign-handshake
        attacker_controllable: true
        control_kinds: [data]
        caller_must_enforce: "none - the link is cryptosign-authenticated"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_bridge_relay_server.erl:360-381"}
  - id: own-persisted-bytes
    component: f8-storage-at-rest
    parameters:
      - name: projection-and-checkpoint-values
        attacker_controllable: false
        control_kinds: [serialized-state]
        caller_must_enforce: "none - own-bytes-rule"
        provenance: {kind: documented, source: "apps/bondy_oplog/src/bondy_oplog_compaction_checkpoint_file.erl:170-176"}
  - id: admin-surface
    component: f10-admin-control-plane
    parameters:
      - name: admin-request
        attacker_controllable: true
        control_kinds: [data]
        obligation_id: restrict-admin-surface
        caller_must_enforce: "restrict the admin listener and unix socket to trusted operators"
        provenance: {kind: inferred, question_id: Q19}

outputs:
  - component: f1-session-protocol
    channel: wamp-call-result-and-event
    taint: same-as-input
    taint_provenance: {kind: documented, source: "threat-model.md s1.3 non-goal"}
    downstream_must_not_assume:
      - id: output-is-sink-safe
        statement: "output is safe to render, execute, log unescaped, or interpolate into HTML, SQL, or a shell"
        provenance: {kind: documented, source: "threat-model.md s1.3 non-goal"}
  - component: f1-session-protocol
    channel: invocation-details-caller-identity
    taint: constrained
    taint_provenance: {kind: documented, source: "apps/bondy_router/src/bondy_dealer.erl:2551-2558"}
    invariants:
      - id: identity-authoritative
        statement: "caller identity comes from the router session context, not from the client message"
        property_id: identity-authoritative
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_dealer.erl:2551-2558"}
    downstream_must_not_assume:
      - id: caller-identity-is-hidden
        statement: "caller identity is withheld from callees; disclosure is ON by default in Bondy, unlike the WAMP spec's opt-in"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_dealer.erl:2547-2558"}
  - component: f1-session-protocol
    channel: details-trust-level
    taint: constrained
    taint_provenance: {kind: documented, source: "README.md Call Trust Levels WIP always 0"}
    downstream_must_not_assume:
      - id: trust-level-is-meaningful
        statement: "trust_level conveys anything; it is always 0 and no policy engine consumes it"
        provenance: {kind: documented, source: "README.md Call Trust Levels WIP always 0"}
  - component: f4-authentication
    channel: wamp-abort-reason
    taint: constrained
    taint_provenance: {kind: documented, source: "bondy_wamp_protocol:abort_message/1 genericization"}
    invariants:
      - id: generic-auth-failure
        statement: "authentication failures return one generic reason"
        property_id: generic-auth-failure
        provenance: {kind: documented, source: "bondy_wamp_protocol:abort_message/1 genericization"}
    downstream_must_not_assume:
      - id: abort-reason-distinguishes-cause
        statement: "the reason distinguishes no-such-user from bad-credentials; it deliberately does not"
        provenance: {kind: documented, source: "bondy_wamp_protocol:abort_message/1 genericization"}
  - component: f9-egress-connectors
    channel: mcp-not-found-response
    taint: constrained
    taint_provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc"}
    invariants:
      - id: mcp-indistinguishable
        statement: "a hidden manifest entry and an absent one answer identically"
        property_id: mcp-indistinguishable
        provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc"}
    downstream_must_not_assume:
      - id: mcp-404-means-absent
        statement: "a 404 means the tool does not exist"
        provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc"}
  - component: f6-http-gateway
    channel: http-gateway-response
    taint: same-as-input
    taint_provenance: {kind: assumption, question_id: Q21}
    downstream_must_not_assume:
      - id: gateway-errors-are-constant-text
        statement: "gateway error bodies are constant text; they are assembled and may include request-derived values"
        provenance: {kind: assumption, question_id: Q21}
  - component: f5-authorization
    channel: realm-export
    taint: sanitized
    taint_provenance: {kind: documented, source: "apps/bondy_router/src/bondy_realm.erl:830-831"}
    downstream_must_not_assume:
      - id: realm-export-includes-private-keys
        statement: "a realm export carries private signing keys; strip_private_keys and to_external exclude them"
        provenance: {kind: documented, source: "apps/bondy_router/src/bondy_realm.erl:830-831"}
  - component: f7-cluster-replication
    channel: replicated-state-on-peer-plane
    taint: same-as-input
    taint_provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
    downstream_must_not_assume:
      - id: peer-plane-is-confidential
        statement: "peer traffic is confidential or authentic; it is plaintext and unauthenticated by default"
        provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - component: f9-egress-connectors
    channel: connector-payload
    taint: same-as-input
    taint_provenance: {kind: assumption, question_id: Q18}
    downstream_must_not_assume:
      - id: connector-payload-is-escaped
        statement: "Bondy escaped the payload for the destination system"
        provenance: {kind: assumption, question_id: Q18}
  - component: f8-storage-at-rest
    channel: logs-and-telemetry
    taint: constrained
    taint_provenance: {kind: inferred, question_id: Q22}
    downstream_must_not_assume:
      - id: all-sensitive-values-redacted
        statement: "every sensitive value is redacted on every logging path; redaction is opt-in per module"
        provenance: {kind: inferred, question_id: Q22}

adversaries:
  - name: anonymous-network-client
    scope: in
    capabilities: [reach-client-listener, supply-pre-auth-bytes, open-many-connections, choose-serializer]
    excluded_capabilities: [valid-credentials, peer-plane-reach, host-access]
    goals: [node-crash, auth-bypass, user-enumeration, resource-exhaustion]
    provenance: {kind: documented, source: "threat-model.md s1.2 role table"}
  - name: authenticated-low-privilege-client
    scope: in
    capabilities: [hold-session-in-one-realm, call-and-publish-where-granted]
    excluded_capabilities: [ungranted-permissions, other-realm-data, control-plane-operations]
    goals: [privilege-escalation, cross-realm-access, traffic-interception]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_rbac.erl:866-870"}
  - name: malicious-callee
    scope: in
    capabilities: [register-procedures, return-arbitrary-payloads, observe-disclosed-caller-identity]
    excluded_capabilities: [router-internals, other-realms, rbac-grant-tables]
    goals: [attack-callers-via-payload, harvest-caller-identities]
    provenance: {kind: documented, source: "threat-model.md s1.8 taint row"}
  - name: llm-agent-via-mcp
    scope: in
    capabilities: [use-role-restricted-ticket, read-curated-manifest]
    excluded_capabilities: [unpublished-tools, mcp-namespace-kwargs, enumeration-via-error-differences]
    goals: [reach-procedures-beyond-delegation]
    provenance: {kind: documented, source: "apps/bondy_mcp/src/bondy_mcp_http_handler.erl moduledoc"}
  - name: bridge-relay-peer
    scope: in
    capabilities: [hold-cryptosign-authenticated-per-realm-link]
    excluded_capabilities: [peer-plane-access, unbridged-realms]
    goals: [inject-or-read-bridged-realm-events]
    provenance: {kind: documented, source: "apps/bondy_router/src/bondy_bridge_relay_server.erl:360-381"}
  - name: peer-plane-on-path-attacker
    scope: out
    capabilities: [read-and-modify-replicated-state, join-as-rogue-peer]
    excluded_capabilities: [excluded-only-under-the-baseline-private-peer-network-assumption]
    goals: [forge-tokens, inject-grants, resurrect-revoked-credentials]
    provenance: {kind: documented, source: "deployment/CLUSTER_MTLS.md Securing the Bondy cluster peer plane; schema/bondy.schema:4334-4343"}
  - name: operator-master-realm-admin
    scope: out
    capabilities: [full-control-plane]
    excluded_capabilities: []
    goals: []
    provenance: {kind: documented, source: "threat-model.md s1.3"}
  - name: host-or-container-compromise
    scope: out
    capabilities: [read-data-directory, read-process-memory]
    excluded_capabilities: []
    goals: []
    provenance: {kind: documented, source: "threat-model.md s1.3"}

