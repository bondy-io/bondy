# 3-node bondy_mst Jepsen harness. Modelled on ra-kv-store's
# jepsen/docker/docker-compose.yml; each node is debian:bookworm with
# NET_ADMIN so iptables-based partition nemeses work, and the control
# container runs the Clojure / lein driver.

# Nodes run the SAME Debian release as deployment/Dockerfile's runner stage
# (`debian:trixie-slim`): the Bondy release jepsen.bondy installs carries an
# erts built on the `erlang:29.x` image, whose binaries need trixie's glibc
# (2.41) — on bookworm (2.36) `bin/validate-config` fails to load with
# "GLIBC_2.38 not found". The bondy_mst shim (built on `erlang:27`, bookworm)
# runs on trixie unchanged, glibc being backward compatible.
x-node-common: &node-common
  networks:
    - jepsen
  image: debian:trixie
  tty: true
  volumes:
    - ../jepsen.bondymst:/root/jepsen.bondymst
    - ../jepsen.bondy:/root/jepsen.bondy
    - ./shared:/root/shared
  cap_add:
    - NET_ADMIN

services:
  control:
    networks:
      - jepsen
    hostname: control
    container_name: jepsen-control
    image: debian:bookworm
    tty: true
    volumes:
      - ../jepsen.bondymst:/root/jepsen.bondymst
      - ../jepsen.bondy:/root/jepsen.bondy
      - ./shared:/root/shared
  n1:
    <<: *node-common
    hostname: n1
    container_name: jepsen-n1
  n2:
    <<: *node-common
    hostname: n2
    container_name: jepsen-n2
  n3:
    <<: *node-common
    hostname: n3
    container_name: jepsen-n3

networks:
  jepsen:
